<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日旅遊英文對話</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  --text:#f1f5f9; --sub:#94a3b8; --border:#334155;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --sub:#64748b; --border:#e2e8f0; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  display:flex; flex-direction:column; align-items:center; padding:18px 14px 32px;}
h1{font-size:19px; margin:4px 0}
.sub{color:var(--sub); font-size:12px; margin-bottom:14px; text-align:center}
.wrap{width:100%; max-width:460px}
.tabs{display:flex; gap:8px; margin-bottom:14px}
.tab{flex:1; text-align:center; padding:9px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--sub); font-size:13px; cursor:pointer}
.tab.active{border-color:var(--accent); color:var(--accent); background:rgba(56,189,248,.1)}
.banner{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px}
.banner .tag{color:var(--accent); font-size:11px; font-weight:700}
.banner .t{font-size:16px; font-weight:700; margin-top:2px}
.banner .zh{color:var(--sub); font-size:12px; margin-top:2px}
.chat{display:flex; flex-direction:column; gap:10px; margin-bottom:14px; min-height:60px}
.bubble{max-width:82%; padding:10px 12px; border-radius:14px; font-size:14px; line-height:1.4}
.npc{align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px}
.me{align-self:flex-end; background:var(--accent); color:#04202c; border-bottom-right-radius:4px}
.bubble .zh{font-size:11px; opacity:.7; margin-top:3px}
.hint-box{background:rgba(245,158,11,.1); border:1px solid var(--warn); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:10px}
.row{display:flex; gap:8px; align-items:center}
input[type=text]{flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px}
.btn{border:none; border-radius:10px; padding:11px 14px; font-size:14px; cursor:pointer; font-weight:600}
.btn-accent{background:var(--accent); color:#04202c}
.btn-ghost{background:var(--card); border:1px solid var(--border); color:var(--text)}
.btn-mic{background:var(--card); border:1px solid var(--border); color:var(--text); padding:11px 13px}
.btn-mic.rec{border-color:var(--bad); color:var(--bad)}
.btn:disabled{opacity:.35}
.toolrow{display:flex; gap:8px; margin-top:10px}
.toolrow .btn{flex:1; font-size:13px; padding:9px}
.score-card{background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:16px; margin-top:14px}
.score-num{font-size:30px; font-weight:800; color:var(--accent)}
.score-fb{font-size:13px; color:var(--text); white-space:pre-wrap; margin-top:8px; line-height:1.5}
.loading{color:var(--sub); font-size:13px}
.shadow-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; text-align:center}
.connect{text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--accent)}
.step-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; text-align:left}
.step-title{color:var(--accent); font-weight:700; font-size:13px; margin-bottom:8px}
.marked-text{font-size:16px; line-height:2; text-align:left}
.shadow-line{font-size:18px; font-weight:700; margin-bottom:4px}
.shadow-zh{color:var(--sub); font-size:13px; margin-bottom:14px}
.match{font-size:26px; font-weight:800; margin:8px 0}
.match.good{color:var(--good)} .match.mid{color:var(--warn)} .match.bad{color:var(--bad)}
.transcript{font-size:13px; color:var(--sub); margin-top:4px}
audio{width:100%; margin-top:10px}
.note{font-size:11px; color:var(--sub); text-align:center; margin-top:10px}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.stat-box{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center}
.stat-num{font-size:28px; font-weight:800; color:var(--accent)}
.stat-label{font-size:12px; color:var(--sub); margin-top:2px}
.hist-item{display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px}
.hist-date{color:var(--sub); font-size:11px}
.hist-score{font-weight:700; color:var(--accent)}
.empty-state{color:var(--sub); font-size:13px; text-align:center; padding:30px 10px}
.word-overlay{position:fixed; top:0; left:0; right:0; bottom:0; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50}
.word-modal{background:var(--card); width:100%; max-width:460px; border-radius:20px 20px 0 0; padding:20px; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); max-height:80vh; overflow-y:auto}
.word-modal-row{display:flex; gap:8px; margin-bottom:12px}
.word-modal input{flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px}
.word-result{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:4px}
.word-result .hw{font-size:20px; font-weight:700}
.word-result .ph{color:var(--sub); font-size:13px; margin:2px 0 8px}
.word-source{font-size:11px; color:var(--sub); margin-top:8px}
.blur-wrap{cursor:pointer}
.blur-text{filter:blur(7px); transition:filter .15s}
.blur-hint{font-size:11px; color:var(--sub); margin-left:6px}
.train-select{display:block;width:100%;max-width:100%;min-width:0;padding:11px 34px 11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;line-height:1.35;white-space:normal;overflow:hidden;text-overflow:ellipsis}
.train-select option{white-space:normal;max-width:100%}
@media(max-width:360px){.train-select{font-size:13px;padding:10px 28px 10px 10px}.step-card{padding:13px}.toolrow{gap:6px}.toolrow .btn{padding:9px 6px;font-size:12px}}
</style>
</head>
<body>
<h1>🗣️ 每日旅遊英文對話</h1>
<div class="sub">每日旅遊情境・對話練習・英文跟讀・口說測驗</div>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-mode="chat">每日對話</div>
    <div class="tab" data-mode="shadow">跟讀測驗</div>
    <div class="tab" data-mode="train">跟讀訓練</div>
    <div class="tab" data-mode="stats">紀錄</div>
  </div>

  <div class="banner">
    <div class="tag">今日情境（可切換）</div>
    <div class="t" id="scTitle"></div>
    <div class="zh" id="scZh"></div>
    <div class="toolrow" id="scenarioPicker"></div>
    <div class="note" id="aiToggle" style="margin-top:8px"></div>
    <div class="note" id="hideTextToggle" style="margin-top:6px"></div>
  </div>

  <div id="chatPane"></div>
  <div id="shadowPane" style="display:none"></div>
  <div id="trainPane" style="display:none"></div>
  <div id="statsPane" style="display:none"></div>
</div>

<script>
const RESTAURANT_DATA = {
  aiOpening: "Welcome to Bella Italia! Ready to order, or do you need a few more minutes?",
  userHints: [
    {text:"Could I have a look at the menu, please?", translation:"我可以看一下菜單嗎？"},
    {text:"What do you recommend here?", translation:"你們這裡推薦什麼？"},
    {text:"I'm ready. I'd like to order a steak, please.", translation:"我準備好了，我想點一份牛排。"},
  ],
  followUpReplies: [
    {keywords:["menu","recommend"], reply:"Sure! Our homemade lasagna is the most popular. Would you like to try that, or perhaps a pizza?"},
    {keywords:["steak","beef"], reply:"Excellent choice. How would you like your steak cooked? Rare, medium, or well-done?"},
    {keywords:["default"], reply:"Got it! And what would you like to drink with your meal?"},
  ]
};

/* ---------- 餐廳情境：分支式資料驅動狀態機 ----------
   關卡與跳轉完全由本地邏輯（identifyRestaurantIntent + resolveRestaurantTransition）決定；
   AI 只負責依「該次跳轉的語境」生成實際的英文句子，AI 不可用或失敗時才使用寫死的 fallback。
   WELCOME 可依使用者說的內容直接跳到 MAIN_COURSE／COOKING／DRINK，不強制每次都照同一條直線走。 */
const RESTAURANT_SCRIPT = {
  WELCOME: {
    aiPromptContext: "Ask whether the guest wants to see the menu or is ready to order.",
    fallback: [
      {en:"Welcome to Bella Italia! Ready to order, or would you like to see the menu?", zh:"歡迎光臨 Bella Italia！準備好點餐了嗎？還是想先看看菜單？"},
      {en:"Hi there! Table for one? Would you like to start with the menu?", zh:"嗨！一位嗎？要先看菜單嗎？"},
      {en:"Good evening! Have you had a chance to look at our menu yet?", zh:"晚安！您看過我們的菜單了嗎？"},
      {en:"Welcome in! Take your time, or let me know if you're ready to order.", zh:"歡迎光臨！慢慢看，準備好隨時跟我說。"}
    ]
  },
  MAIN_COURSE: {
    aiPromptContext: "Help the guest choose a main course. Do not ask about drinks yet.",
    fallback: [
      {en:"Our homemade lasagna is very popular! What would you like for your main course?", zh:"我們的手工千層麵很受歡迎！你主餐想吃什麼呢？"},
      {en:"We've got pizza, pasta, lasagna, and steak tonight. What sounds good to you?", zh:"今晚有披薩、義大利麵、千層麵和牛排，你想吃哪一種？"},
      {en:"What can I get started for your main course?", zh:"你的主餐想點什麼呢？"},
      {en:"Any main dish in mind, or would you like a recommendation?", zh:"主餐有想法了嗎，還是想要我推薦？"}
    ]
  },
  COOKING: {
    aiPromptContext: "Ask how the guest would like their steak cooked. Do not ask about drinks yet.",
    fallback: [
      {en:"Excellent choice! How would you like your steak cooked: rare, medium, or well-done?", zh:"好選擇！你的牛排想要幾分熟？一分熟、五分熟還是全熟？"},
      {en:"Great pick! Rare, medium, or well-done for the steak?", zh:"很棒的選擇！牛排要一分熟、五分熟還是全熟？"},
      {en:"And how would you like that cooked?", zh:"那牛排要幾分熟呢？"}
    ]
  },
  DRINK: {
    aiPromptContext: "Ask what the guest would like to drink. Accept a drink or no drink.",
    fallback: [
      {en:"What would you like to drink with your meal? We have water, tea, coffee, juice, and soft drinks.", zh:"你想搭配餐點喝什麼呢？我們有水、茶、咖啡、果汁和汽水。"},
      {en:"And something to drink? Water, tea, coffee, or juice?", zh:"要喝點什麼嗎？水、茶、咖啡還是果汁？"},
      {en:"Can I get you a drink with that?", zh:"要幫你配一杯飲料嗎？"}
    ]
  },
  DONE: {
    aiPromptContext: "Thank the guest and close the restaurant ordering conversation.",
    fallback: [
      {en:"Perfect! Thank you for your order. Enjoy your meal!", zh:"好的！謝謝你的點餐，祝你用餐愉快！"},
      {en:"All set! Your order will be right out. Enjoy!", zh:"都好了！餐點馬上送上，請慢用！"},
      {en:"Great, that's everything. Thanks, and enjoy your meal!", zh:"好的，就這些了。謝謝，祝用餐愉快！"}
    ]
  }
};

// 餐廳各關卡專屬的提示句（原本四關都共用同一組，現在依目前關卡顯示對應的提示）
const RESTAURANT_HINTS_BY_STAGE = {
  WELCOME: [
    {text:"Could I have a look at the menu, please?", translation:"我可以看一下菜單嗎？"},
    {text:"What do you recommend here?", translation:"你們這裡推薦什麼？"},
    {text:"I'm ready. I'd like to order a steak, please.", translation:"我準備好了，我想點一份牛排。"}
  ],
  MAIN_COURSE: [
    {text:"I'd like the lasagna, please.", translation:"我想要千層麵。"},
    {text:"I'll have the steak, please.", translation:"我要點牛排。"},
    {text:"What's your most popular dish?", translation:"你們最受歡迎的餐點是什麼？"}
  ],
  COOKING: [
    {text:"Medium, please.", translation:"五分熟，謝謝。"},
    {text:"Well-done, please.", translation:"全熟，謝謝。"},
    {text:"Rare, please.", translation:"一分熟，謝謝。"}
  ],
  DRINK: [
    {text:"Water, please.", translation:"請給我水。"},
    {text:"Just a coffee, please.", translation:"一杯咖啡就好，謝謝。"},
    {text:"No drink for me, thanks.", translation:"我不需要飲料，謝謝。"}
  ]
};

function identifyRestaurantIntent(text){
  const t = normalizeText(text);
  if(/\b(menu|recommend|recommendation|suggestion|suggest)\b/.test(t) || /\b(see|look at|have a look at) (the )?menu\b/.test(t)) return {intent: /\b(recommend|suggest)\b/.test(t) ? "RECOMMEND" : "MENU"};
  if(/\b(not yet|more time|few more minutes|still looking)\b/.test(t)) return {intent:"NEED_TIME"};
  if(/\brare\b/.test(t)) return {intent:"COOK_RARE"};
  if(/\bmedium\b/.test(t)) return {intent:"COOK_MEDIUM"};
  if(/\bwell[\s-]?done\b/.test(t)) return {intent:"COOK_WELL"};
  if(/\b(well|cooked through)\b/.test(t)) return {intent:"COOK_WELL"};
  if(/\b(no drink|nothing to drink|nothing|no thanks)\b/.test(t)) return {intent:"NO_DRINK"};
  if(/\b(water|beer|coffee|tea|juice|wine|soda|cola|lemonade|milk)\b/.test(t)) return {intent:"DRINK_ORDER"};
  if(/\b(steak|beef)\b/.test(t)) return {intent:"MAIN_ORDER", item:"steak"};
  if(/\b(pizza|lasagna|pasta|chicken|fish|salad|burger)\b/.test(t)) return {intent:"MAIN_ORDER", item:t};
  if(/\b(ready|let s order|start ordering)\b/.test(t)) return {intent:"READY"};
  if(/\b(yes|yeah|yep|sure|okay|ok)\b/.test(t)) return {intent:"YES"};
  if(/\b(no|nope)\b/.test(t)) return {intent:"NO"};
  if(/\b(thank you|thanks)\b/.test(t)) return {intent:"THANKS"};
  return {intent:"UNKNOWN"};
}

// source: "hint"＝點擊App內建提示句（一律放行，不受完整句子限制）｜"voice"＝語音辨識結果｜"text"＝手動輸入（預設）
// 依「目前關卡」決定驗證規則：主餐單字（pizza/steak）手動輸入時必須是完整句子；飲料單字本身就是完整回答，不限字數
function validateRestaurantInput(raw, stageIdNow, source){
  source = source || "text";
  const t = normalizeText(raw);
  if(!t) return {valid:false};
  if(source === "hint") return {valid:true};

  if(/^(asdf|fdsa|qwer|rewq|zxcv|vcxz|qwerty|asdfgh|zxcvbn)+$/.test(t) || /^(.)\1{3,}$/.test(t)) return {valid:false};
  if(!/[a-z]/i.test(t)) return {valid:false};

  const {intent} = identifyRestaurantIntent(t);
  const wordCount = t.split(" ").filter(Boolean).length;
  const isShortReply = (intent === "YES" || intent === "NO");

  if(stageIdNow === "WELCOME"){
    if(["MENU","RECOMMEND","NEED_TIME","READY"].includes(intent)) return {valid:true};
    if(isShortReply) return {valid:true};
    if(t.replace(/\s/g,"").length < 3) return {valid:false};
    if(intent === "MAIN_ORDER") return {valid:false}; // 單純講菜名（如單字"pizza"）在WELCOME不算完整句子
    if(intent === "UNKNOWN" && wordCount < 2) return {valid:false};
    return {valid:true};
  }
  if(stageIdNow === "MAIN_COURSE"){
    if(["MENU","RECOMMEND","NEED_TIME"].includes(intent)) return {valid:true};
    if(intent === "MAIN_ORDER") return (source === "voice" || wordCount >= 2) ? {valid:true} : {valid:false};
    if(wordCount < 2 && !isShortReply) return {valid:false};
    return {valid:true};
  }
  if(stageIdNow === "COOKING"){
    if(["COOK_RARE","COOK_MEDIUM","COOK_WELL"].includes(intent)) return {valid:true};
    if(wordCount < 2) return {valid:false};
    return {valid:true};
  }
  if(stageIdNow === "DRINK"){
    if(intent === "DRINK_ORDER" || intent === "NO_DRINK") return {valid:true}; // 飲料單字本身就是完整回答
    if(wordCount < 2) return {valid:false};
    return {valid:true};
  }
  return {valid:false};
}

// 純本地決定下一關＋給AI的語境提示＋AI失敗時的降級句；完全不依賴AI判斷關卡
const RESTAURANT_BRANCH_REPLIES = {
  menuAtWelcome: [
    {en:"Of course! Our homemade lasagna is very popular. We also have pizza, pasta, and steak. What would you like for your main course?", zh:"當然可以！我們的手工千層麵很受歡迎，也有披薩、義大利麵和牛排。你主餐想吃什麼呢？"},
    {en:"Sure thing! Tonight's specials are the lasagna and the grilled steak. What sounds good?", zh:"沒問題！今晚的招牌是千層麵跟烤牛排，你想吃哪個？"},
    {en:"Happy to help! We've got pasta, pizza, steak, and lasagna. Anything catch your eye?", zh:"樂意幫忙！我們有義大利麵、披薩、牛排跟千層麵，有喜歡的嗎？"}
  ],
  needTime: [
    {en:"Of course. Take your time. Let me know when you're ready.", zh:"當然沒問題，慢慢看。準備好時再告訴我。"},
    {en:"No rush at all! I'll check back in a bit.", zh:"完全不急！我待會再過來。"},
    {en:"Take all the time you need, just wave me over when you're set.", zh:"慢慢來，準備好招手叫我就好。"}
  ],
  mainChosenAckAtWelcome: [
    {en:"Great choice! What would you like to drink with your meal?", zh:"好選擇！你想搭配餐點喝什麼呢？"},
    {en:"Excellent pick! And to drink?", zh:"很棒的選擇！那飲料呢？"},
    {en:"Nice choice! Anything to drink with that?", zh:"不錯的選擇！要搭配什麼飲料嗎？"}
  ],
  drinkTooEarlyAtMain: [
    {en:"Let's choose your main course first. Would you like pizza, pasta, lasagna, or steak?", zh:"我們先選主餐吧！你想吃披薩、義大利麵、千層麵還是牛排呢？"},
    {en:"We'll get to drinks in a moment — what would you like for your main course?", zh:"飲料等一下再說，你主餐想吃什麼呢？"},
    {en:"Hold that thought! Main course first — any of our pasta, pizza, or steak sound good?", zh:"先別急，主餐先決定吧！義大利麵、披薩或牛排有喜歡的嗎？"}
  ],
  mainChosenAck: [
    {en:"Sounds delicious! What would you like to drink with your meal?", zh:"聽起來很美味！你想搭配餐點喝什麼呢？"},
    {en:"Great pick! Anything to drink with that?", zh:"很棒的選擇！要搭配飲料嗎？"},
    {en:"Good choice! And what would you like to drink?", zh:"好選擇！那你想喝什麼呢？"}
  ],
  cookingInvalid: [
    {en:"How would you like your steak cooked: rare, medium, or well-done?", zh:"你的牛排想要幾分熟？一分熟、五分熟還是全熟？"},
    {en:"Sorry, just to confirm — rare, medium, or well-done?", zh:"不好意思，再確認一下——一分熟、五分熟還是全熟？"}
  ],
  foodTooEarlyAtDrink: [
    {en:"We're choosing your drink now. Would you like water, tea, coffee, juice, or a soft drink?", zh:"我們現在正在選飲料喔！你想喝水、茶、咖啡、果汁還是汽水呢？"},
    {en:"Let's sort out the drink first — water, tea, coffee, or juice?", zh:"先決定飲料吧——水、茶、咖啡還是果汁？"}
  ]
};

function resolveRestaurantTransition(stageIdNow, text){
  const {intent, item} = identifyRestaurantIntent(text);
  switch(stageIdNow){
    case "WELCOME":
      if(intent === "MENU" || intent === "RECOMMEND") return {nextStage:"MAIN_COURSE", aiContext:"The guest asked about the menu or a recommendation. Mention a couple of popular dishes (lasagna, pizza, pasta, steak) and ask what they'd like for their main course.", fallback: RESTAURANT_BRANCH_REPLIES.menuAtWelcome};
      if(intent === "NEED_TIME") return {nextStage:"WELCOME", aiContext:"The guest needs more time to look at the menu. Reassure them warmly and let them take their time.", fallback: RESTAURANT_BRANCH_REPLIES.needTime};
      if(intent === "MAIN_ORDER") return item === "steak"
        ? {nextStage:"COOKING", aiContext:RESTAURANT_SCRIPT.COOKING.aiPromptContext, fallback:RESTAURANT_SCRIPT.COOKING.fallback}
        : {nextStage:"DRINK", aiContext:"The guest already chose their main course. Acknowledge it briefly and ask what they'd like to drink.", fallback: RESTAURANT_BRANCH_REPLIES.mainChosenAckAtWelcome};
      return {nextStage:"MAIN_COURSE", aiContext:RESTAURANT_SCRIPT.MAIN_COURSE.aiPromptContext, fallback:RESTAURANT_SCRIPT.MAIN_COURSE.fallback};

    case "MAIN_COURSE":
      if(intent === "DRINK_ORDER" || intent === "NO_DRINK") return {nextStage:"MAIN_COURSE", aiContext:"The guest mentioned a drink too early. Gently redirect: we need to choose the main course first (pizza, pasta, lasagna, or steak).", fallback: RESTAURANT_BRANCH_REPLIES.drinkTooEarlyAtMain};
      if(intent === "MAIN_ORDER") return item === "steak"
        ? {nextStage:"COOKING", aiContext:RESTAURANT_SCRIPT.COOKING.aiPromptContext, fallback:RESTAURANT_SCRIPT.COOKING.fallback}
        : {nextStage:"DRINK", aiContext:"The guest chose their main course. Acknowledge it and ask what they'd like to drink.", fallback: RESTAURANT_BRANCH_REPLIES.mainChosenAck};
      return {nextStage:"MAIN_COURSE", aiContext:RESTAURANT_SCRIPT.MAIN_COURSE.aiPromptContext, fallback:RESTAURANT_SCRIPT.MAIN_COURSE.fallback};

    case "COOKING":
      if(["COOK_RARE","COOK_MEDIUM","COOK_WELL"].includes(intent)) return {nextStage:"DRINK", aiContext:RESTAURANT_SCRIPT.DRINK.aiPromptContext, fallback:RESTAURANT_SCRIPT.DRINK.fallback};
      return {nextStage:"COOKING", aiContext:RESTAURANT_SCRIPT.COOKING.aiPromptContext, fallback: RESTAURANT_BRANCH_REPLIES.cookingInvalid};

    case "DRINK":
      if(intent === "DRINK_ORDER" || intent === "NO_DRINK") return {nextStage:"DONE", aiContext:RESTAURANT_SCRIPT.DONE.aiPromptContext, fallback:RESTAURANT_SCRIPT.DONE.fallback};
      if(intent === "MAIN_ORDER") return {nextStage:"DRINK", aiContext:"The guest mentioned food again, but we're choosing drinks now. Gently redirect to drink choices (water, tea, coffee, juice, soft drink).", fallback: RESTAURANT_BRANCH_REPLIES.foodTooEarlyAtDrink};
      return {nextStage:"DRINK", aiContext:RESTAURANT_SCRIPT.DRINK.aiPromptContext, fallback:RESTAURANT_SCRIPT.DRINK.fallback};

    default:
      return {nextStage: stageIdNow, aiContext:"Continue the conversation naturally.", fallback:[{en:"Let's continue with your order.", zh:"我們繼續完成點餐吧。"}]};
  }
}

const AIRPORT_ORDER = ["PASSPORT","PURPOSE","STAY","DURATION","DECLARATION","DONE"];

function identifyAirportIntent(text){
  const t = normalizeText(text);
  if(/\b(passport|travel document|document|documents|declaration form|form|paper|show|hand|present)\b/.test(t)) return {intent:"PASSPORT"};
  if(/\b(vacation|holiday|sightseeing|tourism|traveling for leisure|business trip|visiting family|travel|business|work|visit|tourist|leisure|honeymoon|wedding)\b/.test(t)) return {intent:"PURPOSE"};
  if(/\b(hotel|resort|airbnb|apartment|staying with friends|staying with family|address|staying|stay|accommodation|booking|reservation)\b/.test(t)) return {intent:"STAY"};
  if(/\b(round-trip ticket|return ticket|round trip|flight home|return flight|day|days|week|weeks|month|months|going back|leaving|departure)\b/.test(t)) return {intent:"DURATION"};
  if(/\b(nothing to declare|no food|food|meat|fruit|vegetable|plant|animal|medicine|medication|declare|declaration|customs|luggage|baggage|nothing|cigarettes|alcohol|cash)\b/.test(t)) return {intent:"DECLARE"};
  if(/\b(yes|yeah|yep|sure|okay|ok)\b/.test(t)) return {intent:"YES"};
  if(/\b(no|nope)\b/.test(t)) return {intent:"NO"};
  if(/\b(thank you|thanks)\b/.test(t)) return {intent:"THANKS"};
  return {intent:"UNKNOWN"};
}

// 依目前關卡決定驗證規則：hint/voice一律放行；手動文字需為辨識得出意圖的短答或至少兩個字的句子
function validateAirportInput(raw, stageIdNow, source){
  source = source || "text";
  const t = normalizeText(raw);
  if(!t) return {valid:false};
  if(source === "hint" || source === "voice") return {valid:true};
  if(/^(asdf|fdsa|qwer|rewq|zxcv|vcxz|qwerty|asdfgh|zxcvbn)+$/.test(t) || /^(.)\1{3,}$/.test(t)) return {valid:false};
  if(!/[a-z]/i.test(t)) return {valid:false};

  const {intent} = identifyAirportIntent(t);
  const wordCount = t.split(" ").filter(Boolean).length;
  const isShortReply = (intent === "YES" || intent === "NO" || intent === "THANKS");
  const expectedByStage = {PASSPORT:"PASSPORT", PURPOSE:"PURPOSE", STAY:"STAY", DURATION:"DURATION", DECLARATION:"DECLARE"};
  const expected = expectedByStage[stageIdNow];

  if(expected && intent === expected) return {valid:true};
  if(isShortReply) return {valid:true}; // 「no」「nothing」在申報關卡很常見且合理
  if(wordCount < 2) return {valid:false};
  return {valid:true};
}

// 純本地決定下一關＋給AI的語境提示＋AI失敗時的降級句；海關流程本質固定順序，不需要像餐廳那樣的跳關分支
function resolveAirportTransition(stageIdNow, text){
  const idx = AIRPORT_ORDER.indexOf(stageIdNow);
  const nextStage = AIRPORT_ORDER[idx + 1] || "DONE";
  const nextScript = AIRPORT_SCRIPT[nextStage];
  return {nextStage, aiContext: nextScript.aiPromptContext, fallback: nextScript.fallback};
}

const DIRECTIONS_ORDER = ["ASK","ROUTE_DETAIL","TIME_CHECK","DONE"];

function identifyDirectionsIntent(text){
  const t = normalizeText(text);
  if(/\b(where|looking for|lost|help|directions|get to|train station|bus stop|station|how do i|could you tell me)\b/.test(t)) return {intent:"ASK"};
  if(/\b(how long|how far|minutes|walking|on foot|which way|left or right|turn)\b/.test(t)) return {intent:"CLARIFY"};
  if(/\b(thank you|thanks|great|got it|appreciate)\b/.test(t)) return {intent:"THANKS"};
  if(/\b(yes|yeah|yep|sure|okay|ok)\b/.test(t)) return {intent:"YES"};
  if(/\b(no|nope)\b/.test(t)) return {intent:"NO"};
  return {intent:"UNKNOWN"};
}

function validateDirectionsInput(raw, stageIdNow, source){
  source = source || "text";
  const t = normalizeText(raw);
  if(!t) return {valid:false};
  if(source === "hint" || source === "voice") return {valid:true};
  if(/^(asdf|fdsa|qwer|rewq|zxcv|vcxz|qwerty|asdfgh|zxcvbn)+$/.test(t) || /^(.)\1{3,}$/.test(t)) return {valid:false};
  if(!/[a-z]/i.test(t)) return {valid:false};
  const {intent} = identifyDirectionsIntent(t);
  const wordCount = t.split(" ").filter(Boolean).length;
  const isShortReply = (intent === "YES" || intent === "NO" || intent === "THANKS");
  const expectedByStage = {ASK:"ASK", ROUTE_DETAIL:"CLARIFY", TIME_CHECK:"THANKS"};
  const expected = expectedByStage[stageIdNow];
  if(expected && intent === expected) return {valid:true};
  if(isShortReply) return {valid:true};
  if(wordCount < 2) return {valid:false};
  return {valid:true};
}

function resolveDirectionsTransition(stageIdNow, text){
  const idx = DIRECTIONS_ORDER.indexOf(stageIdNow);
  const nextStage = DIRECTIONS_ORDER[idx + 1] || "DONE";
  const nextScript = DIRECTIONS_SCRIPT[nextStage];
  return {nextStage, aiContext: nextScript.aiPromptContext, fallback: nextScript.fallback};
}

function lookupLocalDictionary(word){
  const key = word.trim().toLowerCase();
  return LOCAL_DICTIONARY[key] || null;
}

// 外部 fetch 共用：加上逾時中止，避免被 CSP 擋下或網路異常時請求一直掛著不回應，導致查詢畫面卡死
function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  return fetch(url, {signal: controller.signal}).finally(()=>clearTimeout(timer));
}

// 通用逾時保護：包住任何 Promise，如果它遲遲不 resolve 也不 reject（例如 AI 呼叫卡住沒有回應），
// 逾時後強制視為失敗，讓後續的 catch/本地備援邏輯能正常接手，不會讓畫面永遠停在「請稍候...」
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=> reject(new Error("timeout")), ms))
  ]);
}

// 第二層：Free Dictionary API（在 claude.ai 發布頁面上通常會被 CSP 擋下，fetch 會直接失敗，由 catch 接住）
async function lookupFreeDictionaryApi(word){
  const res = await fetchWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, 4000);
  if(!res.ok) throw new Error("not found");
  const data = await res.json();
  const entry = data[0];
  const meaningObj = entry.meanings && entry.meanings[0];
  const def = meaningObj && meaningObj.definitions && meaningObj.definitions[0];
  if(!def) throw new Error("no definition");
  return {
    phonetic: entry.phonetic || (entry.phonetics && entry.phonetics.find(p=>p.text)?.text) || "",
    meaning: def.definition,
    example: def.example || "",
    source: "Free Dictionary API"
  };
}

// 第三層：Datamuse（只給拼字／相似字建議，不是真正的字義；在 claude.ai 發布頁面上同樣通常會被 CSP 擋下）
async function lookupDatamuseSuggestions(word){
  const res = await fetchWithTimeout(`https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&max=5`, 4000);
  if(!res.ok) throw new Error("request failed");
  const data = await res.json();
  if(!data.length) throw new Error("no suggestions");
  return data.map(d=>d.word);
}

async function lookupWord(word){
  const local = lookupLocalDictionary(word);
  if(local) return {tier:1, ...local};

  try{
    const r = await lookupFreeDictionaryApi(word);
    return {tier:2, ...r};
  }catch(e){ /* CSP 或查無此字，往下一層 */ }

  try{
    const suggestions = await lookupDatamuseSuggestions(word);
    return {tier:3, suggestions};
  }catch(e){ /* CSP 或查無建議 */ }

  return {tier:0};
}

function openWordModal(){
  const overlay = document.createElement("div");
  overlay.className = "word-overlay";
  overlay.id = "wordOverlay";
  overlay.innerHTML = `
    <div class="word-modal">
      <div class="word-modal-row">
        <input type="text" id="wordInput" placeholder="輸入想查詢的英文單字...">
        <button class="btn btn-accent" id="wordSearchBtn">查詢</button>
      </div>
      <div id="wordResultArea"></div>
      <button class="btn btn-ghost" id="wordCloseBtn" style="margin-top:12px;width:100%">關閉</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeWordModal(); });
  document.getElementById("wordCloseBtn").onclick = closeWordModal;
  document.getElementById("wordSearchBtn").onclick = doWordSearch;
  document.getElementById("wordInput").addEventListener("keydown", e=>{ if(e.key==="Enter") doWordSearch(); });
  document.getElementById("wordInput").focus();
}
let wordSearchToken = 0; // 每次開始新查詢就遞增，讓關閉視窗後／連續查詢時，過期的結果自動被放棄
function closeWordModal(){
  wordSearchToken++; // 視窗關閉時讓任何還在進行中的查詢失效
  const overlay = document.getElementById("wordOverlay");
  if(overlay) overlay.remove();
}
async function doWordSearch(){
  const input = document.getElementById("wordInput");
  const word = input.value.trim();
  if(!word) return;
  const myToken = ++wordSearchToken; // 新查詢開始：讓同一個視窗內更早發起、還沒回來的查詢自動作廢
  const area = document.getElementById("wordResultArea");
  area.innerHTML = `<div class="word-result">查詢中...</div>`;
  const result = await lookupWord(word);
  if(myToken !== wordSearchToken || !document.getElementById("wordOverlay")) return; // 已經是過期查詢，或視窗已關閉，直接放棄
  if(result.tier === 1 || result.tier === 2){
    area.innerHTML = `
      <div class="word-result">
        <div class="hw">${word} <button class="btn-ghost btn" style="padding:4px 8px;font-size:11px" id="wordSpkBtn">🔊</button></div>
        ${result.phonetic ? `<div class="ph">${result.phonetic}</div>` : ""}
        <div>${result.meaning}</div>
        ${result.example ? `<div style="color:var(--sub);margin-top:6px">例句：${result.example}</div>` : ""}
        <div class="word-source">${result.tier === 1 ? "離線字典（本地資料）" : "線上來源：" + result.source}</div>
      </div>`;
    document.getElementById("wordSpkBtn").onclick = ()=>speak(word);
  } else if(result.tier === 3){
    area.innerHTML = `
      <div class="word-result">
        查無完整字義，你是不是要找：<br>
        ${result.suggestions.map(s=>`<span class="btn-ghost btn" style="display:inline-block;margin:4px 4px 0 0;padding:4px 10px;font-size:12px;cursor:pointer" data-sugg="${s}">${s}</span>`).join("")}
      </div>`;
    area.querySelectorAll("[data-sugg]").forEach(el=>{
      el.onclick = ()=>{ document.getElementById("wordInput").value = el.dataset.sugg; doWordSearch(); };
    });
  } else {
    area.innerHTML = `<div class="word-result">查無此單字，可參考下方情境提示句，或換個拼法再試一次。</div>`;
  }
}

function dayIndex(n){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,0);
  const diff = d - start;
  const doy = Math.floor(diff / 86400000);
  return doy % n;
}

// 不讓整個App卡在「每句都要先等AI失敗才降級」的狀態。只要有一次成功就會重置計數。
let aiFailureStreak = 0;
const AI_CIRCUIT_BREAKER_THRESHOLD = 3;
function reportAiSuccess(){ aiFailureStreak = 0; }
function reportAiFailure(){
  if(!aiEnabled) return; // 本地模式下本來就不會呼叫AI，不用計入
  aiFailureStreak++;
  if(aiFailureStreak >= AI_CIRCUIT_BREAKER_THRESHOLD){
    aiFailureStreak = 0;

    const area = document.getElementById("endReminder") || document.getElementById("hintArea");

  }
}

/* ---------- 學習紀錄 ---------- */
const REC_KEY = "travel_conv_record_v1";
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function loadRecord(){
  try{
    const raw = localStorage.getItem(REC_KEY);
    return raw ? JSON.parse(raw) : {streak:0, lastDate:null, totalDays:0, history:[]};
  }catch(e){ return {streak:0, lastDate:null, totalDays:0, history:[]}; }
}
function saveRecord(r){ try{ localStorage.setItem(REC_KEY, JSON.stringify(r)); }catch(e){} }
function recordPractice(score, scenarioTitle){
  const r = loadRecord();
  const t = todayStr();
  if(r.lastDate !== t){
    const yest = new Date(); yest.setDate(yest.getDate()-1);
    const yestStr = yest.getFullYear()+"-"+String(yest.getMonth()+1).padStart(2,"0")+"-"+String(yest.getDate()).padStart(2,"0");
    r.streak = (r.lastDate === yestStr) ? r.streak + 1 : 1;
    r.totalDays = r.totalDays + 1;
    r.lastDate = t;
  }
  r.history.unshift({date:t, score, title:scenarioTitle});
  r.history = r.history.slice(0, 30);
  saveRecord(r);
}
function renderStats(){
  const r = loadRecord();
  const pane = document.getElementById("statsPane");
  const avg = r.history.length ? Math.round(r.history.reduce((a,h)=>a+(parseInt(h.score)||0),0)/r.history.length) : 0;
  let html = `<div class="stat-grid">
    <div class="stat-box"><div class="stat-num">🔥 ${r.streak}</div><div class="stat-label">連續天數</div></div>
    <div class="stat-box"><div class="stat-num">${r.totalDays}</div><div class="stat-label">累積練習天數</div></div>
    <div class="stat-box"><div class="stat-num">${avg||"-"}</div><div class="stat-label">平均分數（近30次）</div></div>
    <div class="stat-box"><div class="stat-num">${r.history.length}</div><div class="stat-label">總對話評分次數</div></div>
  </div>`;
  if(r.history.length === 0){
    html += `<div class="empty-state">還沒有紀錄，完成一輪「每日對話」並取得 AI 評分後，這裡就會開始累積 📈</div>`;
  } else {
    html += r.history.map(h => `<div class="hist-item"><div>${h.title}<div class="hist-date">${h.date}</div></div><div class="hist-score">${h.score}/100</div></div>`).join("");
  }
  pane.innerHTML = html;
}

let preferredSpeechRate = 1;
let preferredEnglishVoice = null;
// 跟讀測驗可切換的英語播放口音。實際可用聲音取決於手機／瀏覽器已安裝的語音。
let selectedShadowAccent = "en-US";
const SHADOW_ACCENTS = {
  "en-US": {label:"美式英語", short:"美式", flag:"🇺🇸"},
  "en-GB": {label:"英式英語", short:"英式", flag:"🇬🇧"},
  "en-AU": {label:"澳洲英語", short:"澳式", flag:"🇦🇺"}
};
function getSpeechVoices(){
  if(!window.speechSynthesis) return [];
  return window.speechSynthesis.getVoices() || [];
}
function findEnglishVoice(locale){
  const voices = getSpeechVoices();
  return voices.find(v => String(v.lang).toLowerCase() === locale.toLowerCase()) || null;
}
function refreshSpeechVoices(){
  const voices = getSpeechVoices();
  preferredEnglishVoice = voices.find(v => /^en-US$/i.test(v.lang)) ||
    voices.find(v => /^en-/i.test(v.lang)) || null;
  document.querySelectorAll("[data-shadow-accent-status]").forEach(el=>{
    const locale = selectedShadowAccent;
    const exact = findEnglishVoice(locale);
    el.textContent = exact
      ? `目前可用：${SHADOW_ACCENTS[locale].label}（${exact.name}）`
      : `裝置未列出專用${SHADOW_ACCENTS[locale].label}聲音；播放效果可能由瀏覽器決定。可到手機的文字轉語音設定安裝語音。`;
  });
}
if(window.speechSynthesis){
  refreshSpeechVoices();
  window.speechSynthesis.addEventListener?.("voiceschanged", refreshSpeechVoices);
}
function renderShadowAccentControl(){
  return `<div class="step-card" style="margin-bottom:12px">

      </select>
      <button class="btn btn-ghost" id="shadowAccentTest" style="padding:8px 10px">▶ 試聽</button>
    </div>
    <div class="note" data-shadow-accent-status>正在檢查裝置可用語音…</div>
    <div class="note">這是瀏覽器文字轉語音，不是三段真人錄音；不同手機可選的口音可能不同。</div>
  </div>`;
}
function bindShadowAccentControl(){
  const select = document.getElementById("shadowAccentSelect");
  const test = document.getElementById("shadowAccentTest");
  if(select) select.onchange = ()=>{ selectedShadowAccent=select.value; refreshSpeechVoices(); };

function speak(text, rate, lang){
  try{
    if(!window.speechSynthesis || !window.SpeechSynthesisUtterance){
      setVoiceStatus("此瀏覽器不支援語音播放，仍可閱讀英文文字。", true);
      return false;
    }
    const cleanText = String(text || "").trim();
    if(!cleanText) return false;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = lang || "en-US";
    u.rate = Math.max(0.7, Math.min(1.2, Number(rate) || preferredSpeechRate || 1));
    if(/^en/i.test(u.lang)){
      const localeVoice = findEnglishVoice(u.lang);
      if(localeVoice) u.voice = localeVoice;
      else if(!lang && preferredEnglishVoice) u.voice = preferredEnglishVoice;
    }
    u.onerror = (event)=>{
      if(event && event.error !== "canceled" && event.error !== "interrupted")
        setVoiceStatus("語音播放失敗，請再按一次播放。", true);
    };
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){
    setVoiceStatus("目前無法播放語音，請重新載入頁面後再試。", true);
    return false;
  }
}

function speakRepeated(text, rate, count){
  try{
    if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    window.speechSynthesis.cancel();
    let remaining = Math.max(1, count || 3);
    const playNext = ()=>{
      if(remaining <= 0) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rate || 0.85;
      if(preferredEnglishVoice) u.voice = preferredEnglishVoice;
      u.onend = ()=>{ remaining -= 1; if(remaining > 0) playNext(); };
      u.onerror = ()=>{ remaining = 0; };
      window.speechSynthesis.speak(u);
    };
    playNext();
  }catch(e){}
}

      <button class="btn btn-accent" id="scoreBtn" style="margin-top:10px; width:100%">🤖 取得 AI 評分</button>

  chatPane.innerHTML = html;

  if(step < today.turns.length){

      document.getElementById("hintArea").innerHTML = `<div class="hint-box">💡 試試看： ${today.turns[step].hint}</div>`;
    };
    document.getElementById("sendBtn").onclick = submitAnswer;
    document.getElementById("ansInput").addEventListener("keydown", e=>{ if(e.key==="Enter") submitAnswer(); });
    document.getElementById("micBtn").onclick = toggleMic;

    document.getElementById("emergencyBtn").onclick = openEmergencyModal;
  } else {
    document.getElementById("scoreBtn").onclick = getAiScore;
    document.getElementById("restartBtn").onclick = ()=>{ step=0; log=[]; renderChat(); };
  }
}

function submitAnswer(){
  const input = document.getElementById("ansInput");

  const t = today.turns[step];

  step++;
  renderChat();
}

/* ---------- 動態劇本（機場／飯店／餐廳：持續多輪對話＋使用者主動結束評分） ---------- */
let dynHistory = []; // {from:'ai'|'user', text}
let dynTurns = 0;      // 已完成的「有效」使用者回合數（送出訊息且成功取得AI/本地回覆才算一回合）
let dynPhase = 'chat'; // 'chat' = 對話進行中｜'scoring' = 正在顯示/產生學習報告
let reportRecorded = false; // 避免重新評分時重複寫入學習紀錄
const MIN_TURNS = 6;   // 至少完成幾回合才允許開始評分（純自由對話情境適用）
const TARGET_TURNS = 8; // 建議目標回合數（僅用於AI對話提示語氣，非強制上限）
function curMaxTurns(){ return (today.dynamic && today.dynamic.maxTurns) || TARGET_TURNS; }

// 關卡式情境（目前為餐廳）專用狀態：關卡進度完全由本地狀態機決定，AI只負責產生「符合該次跳轉語境」的回覆內容
let stageId = null;
let stagedCompleted = false; // 關卡式流程是否已完整走到 DONE
let lastInputSource = "text"; // "hint"｜"voice"｜"text"：記錄這次要送出的內容從哪裡來
let isEnding = false; // 與 isSending（防止同一回合重複送出）區分：這個是防止「結束並評分」被重複觸發
let stagedCompletionStarted = false; // 防止關卡式情境抵達DONE的完成流程被重複處理（獨立於 reportRecorded，是更早一層的冪等保護）

function initDynamic(){
  sessionToken++;
  dynHistory = []; dynTurns = 0; log = []; dynPhase = 'chat'; reportRecorded = false;
  stageId = today.dynamic.stagedEngine ? today.dynamic.startStage : null;
  stagedCompleted = false;
  lastInputSource = "text";
  isEnding = false;
  stagedCompletionStarted = false;
  fallbackStreak = 0;
  recentAiLines = [];
  revealedSet = new Set();
  renderDynamicChat();
  const openingObj = today.dynamic.stagedEngine
    ? pickReplyVariant(today.dynamic.script[today.dynamic.startStage].fallback)
    : {en: today.dynamic.aiOpening, zh: today.dynamic.aiOpeningZh || ""};
  pushAiTyping({reply: openingObj.en, hint: openingObj.zh || ""});
}

// 關卡式情境抵達 DONE 的唯一完成入口（餐廳／機場共用）：具備冪等性，不論被呼叫幾次，評分流程只會真的執行一次
async function completeStagedSession(){
  if(stagedCompletionStarted) return;
  stagedCompletionStarted = true;

  dynPhase = 'scoring';
  renderDynamicChat(); // 先切到評分畫面的容器（輸入框從DOM整個移除）

  await runScoring(); // runScoring 內部自己負責把結果寫進 #scoreCard，這裡不需要再render一次，否則會蓋掉評分結果
}

function renderDynamicChat(){
  let html = `<div class="chat" id="chatLog">`;
  dynHistory.forEach((m,idx)=>{
    html += m.from==='ai'
      ? `<div class="bubble npc">${renderBubbleText(idx, m.text)}${m.hint && (!hideTextMode || revealedSet.has(idx)) ? `<div class="zh">💡 ${m.hint}</div>` : ""}</div>`
      : `<div class="bubble me">${m.text}</div>`;
  });
  html += `</div>`;

  if(dynPhase === 'chat'){
    html += `<div id="hintArea"></div>
    <div class="row">
      <input type="text" id="ansInput" placeholder="輸入或錄音你的回答...">
      <button class="btn btn-mic" id="micBtn">🎤</button>
      <button class="btn btn-accent" id="sendBtn">送出</button>
    </div>
    <div id="voiceStatus" class="note" role="status" aria-live="polite" style="min-height:14px;text-align:left"></div>
    <button class="btn btn-ghost" id="analyzeAnswerBtn" style="width:100%;margin-top:6px">🧠 免費分析我的回答</button>
    <div id="answerAnalysis" aria-live="polite"></div>
    <div class="toolrow">
      <button class="btn btn-ghost" id="hintBtn">💡 提示我</button>
      <button class="btn btn-ghost" id="wordLookupBtn" style="flex:0 0 auto">📖 查單字</button>
      <button class="btn btn-ghost" id="emergencyBtn" style="flex:0 0 auto">🆘 應急短句</button>
    </div>`;
    if(today.dynamic.stagedEngine){
      // 關卡式情境：生命週期由狀態機管理，走完整個流程才會自動結束並評分，不提供中途手動結束
      html += `<div class="note">${today.dynamic.completionNote || "完成整個流程後會自動結束並產生學習報告"}</div>`;
    } else {
      html += `<div id="endReminder"></div>`;
      if(dynTurns >= MIN_TURNS){
        html += `<div class="hint-box" style="background:rgba(34,197,94,.12);border-color:var(--good);color:var(--good)">🎉 你已完成基礎練習！可以隨時點擊下方按鈕查看評分報告，或繼續練習。</div>`;
      }
      html += `<div class="toolrow">
        <button class="btn btn-ghost" id="endScoreBtn" style="width:100%">🏁 結束對話並評分（${dynTurns}/${MIN_TURNS}）</button>
      </div>`;
    }
  } else {
    html += `<div class="score-card" id="scoreCard">
      <div class="loading">AI 正在產生學習報告，請稍候...</div>
    </div>`;
  }

  chatPane.innerHTML = html;
  const logEl = document.getElementById("chatLog");
  if(logEl) logEl.scrollTop = logEl.scrollHeight;
  bindRevealHandlers(chatPane);

  if(dynPhase === 'chat'){
    document.getElementById("hintBtn").onclick = showDynHints;
    document.getElementById("sendBtn").onclick = sendDynamicAnswer;
    document.getElementById("ansInput").addEventListener("keydown", e=>{ if(e.key==="Enter") sendDynamicAnswer(); });
    document.getElementById("ansInput").addEventListener("input", ()=>{ lastInputSource = "text"; setVoiceStatus(""); });
    document.getElementById("micBtn").onclick = toggleMic;
    document.getElementById("analyzeAnswerBtn").onclick = ()=>analyzeLocalAnswer("ansInput", "answerAnalysis");
    document.getElementById("wordLookupBtn").onclick = openWordModal;
    document.getElementById("emergencyBtn").onclick = openEmergencyModal;
    const endBtn = document.getElementById("endScoreBtn");
    if(endBtn) endBtn.onclick = requestEndAndScore;
  }
}

function requestEndAndScore(){
  if(isEnding) return; // 防止重複點擊重複觸發評分
  const bypassMinTurns = stagedCompleted; // 結構化流程（如餐廳）已完整走完四關，視為一次完整對話，不受最低回合數限制
  if(!bypassMinTurns && dynTurns < MIN_TURNS){
    document.getElementById("endReminder").innerHTML =
      `<div class="hint-box">再練習幾輪就可以查看學習報告囉！目前已完成 ${dynTurns}/${MIN_TURNS} 個有效回合。</div>`;
    return;
  }
  // 同一個同步事件處理流程中立即鎖定：先設旗標，再切換畫面（畫面切換會讓輸入框/結束按鈕整個從DOM移除）
  isEnding = true;
  dynPhase = 'scoring';
  renderDynamicChat();
  runScoring();
}

function showDynHints(){
  const hints = (today.dynamic.stagedEngine && today.dynamic.hintsByStage && today.dynamic.hintsByStage[stageId])
    ? today.dynamic.hintsByStage[stageId]
    : today.dynamic.userHints;
  document.getElementById("hintArea").innerHTML =
    `<div class="hint-box">💡 可以試試看這些句子（點一下自動填入輸入框）：</div>` +
    hints.map((h,i) => `<div class="hint-box" style="cursor:pointer;margin-top:6px" data-hint="${i}">${h.text}<div style="opacity:.8">${h.translation}</div></div>`).join("");
  document.querySelectorAll("[data-hint]").forEach(el=>{
    el.onclick = ()=>{
      document.getElementById("ansInput").value = hints[parseInt(el.dataset.hint)].text;
      lastInputSource = "hint"; // 標記這是點擊App內建提示句填入的，送出時可跳過「完整句子」檢查
    };
  });
}

/* ---------- 文字正規化與關鍵字比對（修復版） ---------- */
function normalizeText(s){
  return (s || "").toLowerCase().trim().replace(/[.,!?;:'"()]/g, "").replace(/\s+/g, " ");
}

// 片語（含空白／連字號）用字串包含比對；單一字詞用「詞界」比對，避免 "here" 誤判到 "adhere" 這類狀況
function matchesPhrase(norm, phrase){
  const p = phrase.toLowerCase().trim();
  if(p.includes(" ") || p.includes("-")){
    return norm.includes(p) || norm.includes(p.replace(/-/g, " "));
  }
  const esc = p.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
  return new RegExp("\\b" + esc + "\\b").test(norm);
}

// 判斷是否為無意義輸入（單一字母、重複字母、純數字、無母音的亂碼字）
function looksLikeGibberish(raw){
  const norm = normalizeText(raw);
  const words = norm.split(" ").filter(Boolean);
  if(words.length === 0) return true;
  if(words.length === 1){
    const w = words[0];
    if(w.length <= 1) return true;
    if(/^[0-9]+$/.test(w)) return true;
    if(/^(ii|xx|zz|qq|aa)$/.test(w)) return true;
    if(w.length >= 3 && !/[aeiou]/.test(w)) return true;
    if(/^(asdf|qwer|qwerty|zxcv|jkl|hjkl|asdfgh|zxcvbn)/.test(w)) return true;
  }
  return false;
}

// 跨所有關鍵字組比對，取「最具體（最長）」的那個匹配片語獲勝，
// 避免像 "room"、"here"、"stay" 這類會出現在多個語境的字詞誤判意圖
function bestIntentMatch(rules, text){
  const norm = normalizeText(text);
  let best = null; // {len, reply}
  Object.keys(rules).forEach(name => {
    if(name === "fallback") return;
    const group = rules[name];
    if(!group || !group.keys) return;
    group.keys.forEach(k => {
      if(matchesPhrase(norm, k) && (!best || k.length > best.len)){
        best = {len: k.length, reply: group.reply};
      }
    });
  });
  return best ? best.reply : null;
}

function pickFollowUp(text){
  const rules = today.dynamic.followUpReplies;
  if(Array.isArray(rules)){
    // 餐廳格式：[{keywords:[...], reply}]
    const low = text.toLowerCase();
    const match = rules.find(f => !f.keywords.includes("default") && f.keywords.some(k => low.includes(k)));
    if(match) return match.reply;
    const defaults = rules.filter(f => f.keywords.includes("default"));
    return defaults.length ? defaults[Math.floor(Math.random()*defaults.length)].reply : "I see, got it!";
  } else {
    // 機場／飯店格式：{groupName:{keys:[...], reply}, ..., fallback:"..."}
    return bestIntentMatch(rules, text) || rules.fallback || "I see, got it!";
  }
}

// 機場／飯店在連續無法辨識意圖時使用的替代回覆與自然收尾句（避免一直重複同一句 fallback）
const SCENARIO_FALLBACK_VARIANTS = {
  airport: [
    "I see. Please step forward, look at the camera, and place your right index finger on the scanner.",
    "No problem — let's continue. Could you tell me a bit more about that?",
    "I understand. Let's move on to the next step of your arrival."
  ],
  hotel: [
    "Got it. Let me note that down for you. Is there anything else I can help you with?",
    "Understood — let's continue. What else would you like to know?",
    "Sure thing, I'll take care of that. Anything else?"
  ]
};
const SCENARIO_NATURAL_CLOSINGS = {
  airport: [
    "Everything is set! Welcome and enjoy your trip!",
    "You're all set. Have a wonderful stay!",
    "Thank you. Enjoy your time here!"
  ],
  hotel: [
    "You're all set! Enjoy your stay with us.",
    "Is there anything else I can help you with before I let you go?",
    "Thank you, and have a wonderful stay!"
  ]
};
let fallbackStreak = 0;   // 連續沒有命中任何關鍵字意圖的次數（命中一次就重置）
let recentAiLines = [];   // 最近講過的幾句，避免挑到一模一樣的句子

function pickNonRepeating(options){
  const pool = options.filter(o => !recentAiLines.includes(o));
  const list = pool.length ? pool : options;
  const picked = list[Math.floor(Math.random() * list.length)];
  recentAiLines.push(picked);
  if(recentAiLines.length > 4) recentAiLines.shift();
  return picked;
}

// 餐廳關卡用：從 {en,zh} 陣列挑一句，避免跟最近講過的重複；若傳入的是單一物件（舊格式）直接原樣回傳，向下相容
function pickReplyVariant(fallback){
  if(!Array.isArray(fallback)) return fallback;
  const pool = fallback.filter(f => !recentAiLines.includes(f.en));
  const list = pool.length ? pool : fallback;
  const picked = list[Math.floor(Math.random() * list.length)];
  recentAiLines.push(picked.en);
  if(recentAiLines.length > 4) recentAiLines.shift();
  return picked;
}

// AI 不可用或呼叫失敗時的本地備援：優先用關鍵字比對給切題回覆；
// 真的沒有命中任何意圖時，不要每次都講同一句 fallback——先換句話說，連續多次都沒命中才自然收尾（仍不代表對話結束、不會觸發評分）
function localFallbackReply(text){
  const rules = today.dynamic.followUpReplies;
  if(!rules || Array.isArray(rules)){
    return {reply: (rules ? pickFollowUp(text) : "I see, got it! Let's continue."), hint: ""};
  }
  const matched = bestIntentMatch(rules, text);
  if(matched){
    fallbackStreak = 0; // 這次真的對上關鍵字了，重置連續 fallback 計數
    return {reply: matched, hint: ""};
  }

  fallbackStreak++;
  const key = today.dynamic.correctionKey; // "airport" | "hotel"
  const closings = key && SCENARIO_NATURAL_CLOSINGS[key];
  const variants = key && SCENARIO_FALLBACK_VARIANTS[key];

  let reply;
  if(fallbackStreak >= 3 && closings){
    reply = pickNonRepeating(closings);
  } else if(variants){
    reply = pickNonRepeating(variants);
  } else {
    reply = rules.fallback || "I see, got it! Let's continue.";
  }
  return {reply, hint: ""};
}

const GIBBERISH_REPLY = {
  reply: "Sorry, I didn't quite understand that. Could you try answering in a complete sentence?",
  hint: "我不太確定你的意思，試著用完整的英文句子回答看看吧！"
};

let isSending = false;

function sendDynamicAnswer(){
  if(isSending) return;
  const input = document.getElementById("ansInput");
  const val = input.value.trim();
  if(!val) return;
  input.value = "";

  // 統一在這裡讀取這次送出的來源（提示句按鈕／語音辨識／手動輸入都共用同一個 lastInputSource），
  // 讀完立刻重置，避免下一則手動輸入被誤判成同一個來源
  const source = lastInputSource;
  lastInputSource = "text";

  // 關卡式情境（目前為餐廳／機場）：關卡推進完全交給本地狀態機，不走下方的自由對話邏輯
  if(today.dynamic.stagedEngine){
    handleStagedAnswer(val, source);
    return;
  }

  const lastAi = [...dynHistory].reverse().find(m=>m.from==='ai');
  dynHistory.push({from:'user', text:val});
  renderDynamicChat(); // 先讓使用者的話立即顯示在對話中

  // 無意義輸入檢查：只套用在手動文字（text）；提示句／語音辨識已經是明確內容，略過此檢查
  if(source === "text" && looksLikeGibberish(val)){
    if(lastAi && lastAi.text === GIBBERISH_REPLY.reply) return; // 連續無效輸入時不重複堆疊同一句引導訊息
    isSending = true;
    pushAiTyping(GIBBERISH_REPLY).then(()=>{ isSending = false; });
    return;
  }

  // 提示句（hint）一樣會正常對話、正常取得 AI 回覆，但不計入有效回合數、也不寫入評分用的 log，
  // 避免「使用者點提示句」被誤當成「使用者自己的英文能力」拿去評分
  if(source !== "hint"){
    log.push({npc: lastAi ? lastAi.text : today.dynamic.aiOpening, zh:"", userAnswer:val});
  }
  isSending = true;
  const finishTurn = ()=>{
    if(source !== "hint") dynTurns++;
    isSending = false;
    renderDynamicChat();
  };

  if(today.dynamic.aiDriven){
    pushAiTyping(() => generateAiReply(val)).then(finishTurn);
  } else {
    pushAiTyping(pickFollowUp(val)).then(finishTurn);
  }
}

// contentOrFn：字串＝固定台詞；{reply,hint}物件＝直接顯示；函式＝呼叫 AI 即時生成（回傳字串或 {reply,hint}）
async function pushAiTyping(contentOrFn){
  const myToken = sessionToken; // 記住發起當下的情境版本
  const logEl = document.getElementById("chatLog");
  if(!logEl) return;
  const typingDiv = document.createElement("div");
  typingDiv.className = "bubble npc";
  typingDiv.style.opacity = "0.6";
  typingDiv.textContent = "家教正在打字中...";
  logEl.appendChild(typingDiv);
  logEl.scrollTop = logEl.scrollHeight;

  let text, hint = "";
  if(typeof contentOrFn === "function"){
    const result = await contentOrFn();
    if(myToken !== sessionToken) return; // 情境已切換／重新開始，這則回覆已過期，直接捨棄
    if(result && typeof result === "object"){ text = result.reply; hint = result.hint || ""; }
    else { text = result; }
  } else if(contentOrFn && typeof contentOrFn === "object"){
    await new Promise(r => setTimeout(r, 500));
    if(myToken !== sessionToken) return;
    text = contentOrFn.reply; hint = contentOrFn.hint || "";
  } else {
    await new Promise(r => setTimeout(r, 1000));
    if(myToken !== sessionToken) return;
    text = contentOrFn;
  }
  dynHistory.push({from:'ai', text, hint});
  renderDynamicChat();
  speak(text);
}

// 真正的 AI 即時生成下一句對話：具備三層模糊容錯。AI 不可用或呼叫失敗時，
// 改用可靠的本地關鍵字比對（localFallbackReply）產生合理回覆，絕不中斷對話、絕不出現罐頭式「聽不懂」回應
async function generateAiReply(userText){
  if(!aiEnabled) return localFallbackReply(userText); // 本地練習模式：完全不呼叫 AI，不消耗額度
  try{
    const sample = await withTimeout(claude.use("sample"), 8000);
    if(!sample){ reportAiFailure(); return localFallbackReply(userText); }
    const history = dynHistory.map(m => (m.from==='ai' ? "教練" : "學生") + "：" + m.text).join("\n");
    const topics = (today.dynamic.topics || []).join("、");
    const prompt = `你是一位有耐心、溫暖、絕不讓學生卡住的英文口說教練，正在角色扮演「${today.title}」情境中的角色（海關人員或飯店櫃檯人員），用英文和一位英文學習者做口說對話練習。

目前對話紀錄：
${history}

這段對話全程大約 ${curMaxTurns()} 輪，過程中要自然地（不要死板、不要機械式逐項詢問）帶到這些主題：${topics}。

請依照下面三層原則回應學生剛剛說的那句話（你自己判斷屬於哪一層，不用寫出判斷過程，也不用在回覆中說明）：
1. 回答切題且文法大致正確 → 直接自然延伸對話，帶出下一個相關問題。
2. 回答看得出意圖，但文法有誤或用字不太道地 → 先用一句簡短英文給予肯定（如 "Got it!" "I see what you mean!"），接著依然自然地問下一個問題，絕對不要指出這是錯的、不要說 "I don't understand" 或 "Could you say that again" 之類的話。
3. 回答完全離題 → 用幽默、順著話接一句（例如對方提到披薩，你可以說 "Haha, pizza sounds great, but first, do you have your boarding pass?"），再優雅地把話題拉回情境主題，絕對不可以說聽不懂或要求重講。

無論學生說了什麼，你都必須自然地推進對話，絕對不能卡住、絕對不能使用任何道歉或要求重說的罐頭句。

只回傳一個 JSON 物件，不要加其他文字、不要用 markdown code block，格式為：
{"reply":"你的英文回應（延伸對話＋拋出下一個問題）","hint":"若第2或第3層情況，這裡給一句簡短的繁體中文提示，教學生更道地的講法；若第1層（回答已經很好）則留空字串"}`;
    const res = await withTimeout(sample(prompt, {modelTier:"quick"}), 20000);
    const raw = (res.text || "").trim().replace(/^```json\s*|```$/g, "");
    try{
      const parsed = JSON.parse(raw);
      if(parsed && parsed.reply){ reportAiSuccess(); return {reply: parsed.reply, hint: parsed.hint || ""}; }
    }catch(e){ /* 解析失敗則往下走本地備援 */ }
    if(raw){ reportAiSuccess(); return {reply: raw.replace(/^["']|["']$/g, ""), hint: ""}; }
    reportAiFailure();
    return localFallbackReply(userText);
  }catch(e){
    reportAiFailure();
    return localFallbackReply(userText);
  }
}

// 關卡式流程專用：依指定關卡的 aiPromptContext 生成回覆；AI 不可用或失敗時使用該關卡自己的本地降級回覆
async function getStageAiReply(stage, userText){
  if(!aiEnabled) return pickReplyVariant(stage.fallbackResponse); // 本地練習模式：不呼叫 AI，從多個備援句中挑一句
  try{
    const sample = await withTimeout(claude.use("sample"), 8000);
    if(!sample){ reportAiFailure(); return pickReplyVariant(stage.fallbackResponse); }
    const history = dynHistory.map(m => (m.from==='ai' ? "教練" : "學生") + "：" + m.text).join("\n");
    const prompt = `${stage.aiPromptContext}\n\n目前對話紀錄：\n${history}\n\n學生剛剛說："${userText}"\n\n只回傳一個 JSON 物件，不要加其他文字、不要用 markdown code block，格式為：\n{"en":"你的英文回應","zh":"對應的繁體中文翻譯"}`;
    const res = await withTimeout(sample(prompt, {modelTier:"quick"}), 20000);
    const raw = (res.text || "").trim().replace(/^```json\s*|```$/g, "");
    const fallbackVariant = pickReplyVariant(stage.fallbackResponse);
    try{
      const parsed = JSON.parse(raw);
      if(parsed && parsed.en){ reportAiSuccess(); return {en: parsed.en, zh: parsed.zh || fallbackVariant.zh}; }
    }catch(e){ /* 解析失敗則往下走本地備援 */ }
    if(raw){ reportAiSuccess(); return {en: raw.replace(/^["']|["']$/g, ""), zh: fallbackVariant.zh}; }
    reportAiFailure();
    return fallbackVariant;
  }catch(e){
    reportAiFailure();
    return pickReplyVariant(stage.fallbackResponse);
  }
}

// 關卡式流程的送出處理：是否推進、推進到哪一關，完全由 validateRestaurantInput()／
// resolveRestaurantTransition() 這兩個純本地函式決定；AI 只負責依跳轉語境生成實際句子，
// 絕不會被拿來判斷使用者是否「過關」。顯示（打字動效／語音播放／過期捨棄）統一交給 pushAiTyping。
function handleStagedAnswer(val, source){
  const myToken = sessionToken;

  // 終點狀態防護：DONE 之後（含正在評分／已評分）一律拒絕新輸入，不回到點餐流程
  if(stageId === "DONE" || dynPhase !== 'chat'){
    return;
  }

  dynHistory.push({from:'user', text: val});
  renderDynamicChat();

  const validation = today.dynamic.validateInput(val, stageId, source);
  if(!validation.valid){
    // 驗證未通過：不計入回合、不推進關卡
    isSending = true;
    pushAiTyping({reply:"Sorry, I didn't quite understand that. Could you try answering in a complete sentence?", hint:"抱歉，我不太理解你的意思。請試著用完整的英文句子回答。"})
      .then(()=>{ isSending = false; });
    return;
  }

  // 驗證通過。提示句（hint）一樣會正常對話、正常推進關卡，但不寫入評分用的 log、也不計入 dynTurns——
  // 避免「使用者點提示句」被當成「使用者自己的英文能力」拿去評分
  if(source !== "hint"){
    const lastAi = [...dynHistory].reverse().find(m=>m.from==='ai');
    log.push({npc: lastAi ? lastAi.text : today.dynamic.aiOpening, zh:"", userAnswer: val});
  }

  // 本地決定下一關＋給AI的語境提示＋AI失敗時的降級句（純本地，不經過AI）；狀態轉移不受來源影響，一律正常推進
  const transition = today.dynamic.resolveTransition(stageId, val);
  const willBeDone = transition.nextStage === "DONE";

  // 這段關卡推進邏輯獨立成一個函式，並同時掛在 .then() 與 .catch()：
  // 不管 pushAiTyping／AI 呼叫過程中發生什麼（成功、AI失敗降級、或任何未預期的例外），
  // 只要 session 還是同一個，關卡狀態都一定會被正確套用，不會卡在對話頁出不去
  function applyStagedTransition(){
    isSending = false;
    if(myToken !== sessionToken) return; // 情境已切換／重置期間完成，不要再動關卡狀態
    stageId = transition.nextStage;
    if(source !== "hint") dynTurns++;
    if(willBeDone){
      // 抵達真正的終點：交給唯一的完成入口處理（鎖定輸入＋切到評分畫面＋觸發一次評分），
      // 之後不論使用者再輸入什麼，都不會回到原本的點餐流程，除非按「重新開始本輪」
      stagedCompleted = true;
      completeStagedSession();
    } else {
      renderDynamicChat();
    }
  }

  isSending = true;
  pushAiTyping(async () => {
    try{
      const reply = await getStageAiReply({aiPromptContext: transition.aiContext, fallbackResponse: transition.fallback}, val);
      return {reply: reply.en, hint: reply.zh || ""};
    }catch(e){
      // getStageAiReply 理論上不會丟出例外，這裡再加一層保險，確保一定回傳可顯示的內容
      const fb = pickReplyVariant(transition.fallback);
      return {reply: fb.en, hint: fb.zh || ""};
    }
  }).then(applyStagedTransition).catch(applyStagedTransition);
}

let recognition = null, recognizing = false, recognitionStarting = false;
let micSessionToken = 0;
function setVoiceStatus(message, isError){
  const el = document.getElementById("voiceStatus");
  if(!el) return;
  el.textContent = message || "";
  el.style.color = isError ? "var(--bad)" : "var(--sub)";
}
function resetMicButton(){
  recognizing = false;
  recognitionStarting = false;
  const btn = document.getElementById("micBtn");
  if(btn){ btn.classList.remove("rec"); btn.textContent = "🎤"; btn.disabled = false; }
}
function micErrorMessage(error){
  const name = error && error.error ? error.error : (error && error.name ? error.name : "");
  if(name === "not-allowed" || name === "service-not-allowed" || name === "NotAllowedError" || name === "PermissionDeniedError")
    return "麥克風／語音辨識權限遭拒。請在 Android 設定允許 Chrome 使用麥克風，並在 Chrome 網站設定中允許此網站，再重新載入。";
  if(name === "no-speech") return "沒有辨識到語音。請靠近麥克風、降低背景噪音後再試。";
  if(name === "audio-capture" || name === "NotFoundError") return "找不到可用的麥克風。請確認裝置麥克風正常，並關閉可能占用麥克風的 App。";
  if(name === "network") return "瀏覽器語音辨識服務或網路連線失敗。請確認網路正常後再試；此功能不保證離線可用。";
  if(name === "aborted") return "錄音已取消。你可以再次點擊麥克風。";
  if(name === "SecurityError" || !window.isSecureContext) return "請透過 Netlify 的 HTTPS 網址使用麥克風，不要從下載資料夾直接開啟 HTML。";
  return getMicrophoneHelp({name: name || "UnknownError"});
}
function stopMicSafely(){
  micSessionToken++;
  const old = recognition;
  recognition = null;
  resetMicButton();
  if(old){
    try{ old.onresult = null; old.onerror = null; old.onend = null; old.stop(); }catch(e){
      try{ old.abort(); }catch(_){}
    }
  }
}
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById("micBtn");
  const input = document.getElementById("ansInput");
  if(!micBtn || !input) return;
  if(recognizing || recognitionStarting){
    setVoiceStatus("正在停止錄音…");
    try{ if(recognition) recognition.stop(); }catch(e){ resetMicButton(); }
    return;
  }
  if(!window.isSecureContext){
    setVoiceStatus("請使用 Netlify HTTPS 網址開啟 TravelTalk；直接開啟下載的 HTML 可能無法使用麥克風。", true);
    return;
  }
  if(!SR){
    setVoiceStatus("此瀏覽器不支援語音辨識，請改用文字輸入。", true);
    return;
  }
  // 同一時間只允許一個辨識器，並綁定目前頁面／情境，避免舊結果寫入新對話。
  if(recognition){ try{ recognition.abort(); }catch(e){} recognition = null; }
  const thisToken = ++micSessionToken;
  let gotFinalResult = false;
  let localRecognition;
  try{
    localRecognition = new SR();
    recognition = localRecognition;
    localRecognition.lang = "en-US";
    localRecognition.interimResults = true;
    localRecognition.maxAlternatives = 1;
    localRecognition.continuous = false;
    localRecognition.onstart = ()=>{
      if(thisToken !== micSessionToken || recognition !== localRecognition) return;
      recognitionStarting = false; recognizing = true;
      micBtn.classList.add("rec"); micBtn.textContent = "⏹";
      setVoiceStatus("正在聆聽英文…說完後請稍候，或按 ⏹ 停止。", false);
    };
    localRecognition.onresult = (event)=>{
      if(thisToken !== micSessionToken || recognition !== localRecognition || !input.isConnected) return;
      let interim = "", finalText = "";
      for(let i=event.resultIndex; i<event.results.length; i++){
        const result = event.results[i];
        if(result.isFinal) finalText += result[0].transcript;
        else interim += result[0].transcript;
      }
      if(finalText.trim()){
        const transcript = finalText.trim();
        input.value = transcript;
        lastInputSource = "voice";
        gotFinalResult = true;
        setVoiceStatus("辨識完成：請確認英文文字，再按「送出」。語音辨識結果不會自動送出或額外計分。", false);
      }else if(interim.trim()){
        setVoiceStatus("辨識中：" + interim.trim(), false);
      }
    };
    localRecognition.onerror = (event)=>{
      if(thisToken !== micSessionToken || recognition !== localRecognition) return;
      if(event.error !== "aborted") setVoiceStatus(micErrorMessage(event), true);
      else if(!gotFinalResult) setVoiceStatus("錄音已取消，可以再次嘗試。", false);
      resetMicButton();
    };
    localRecognition.onend = ()=>{
      if(thisToken !== micSessionToken || recognition !== localRecognition) return;
      recognition = null;
      resetMicButton();
      if(gotFinalResult){
        // 保留辨識來源，直到使用者手動編輯或送出；不自動提交。
      }else{
        const status = document.getElementById("voiceStatus");
        if(status && !status.textContent) setVoiceStatus("沒有取得辨識結果，請再試一次或改用文字輸入。", true);
      }
    };
    recognitionStarting = true;
    micBtn.disabled = true;
    setVoiceStatus("正在啟動語音辨識…若瀏覽器詢問麥克風權限，請選擇允許。", false);
    localRecognition.start();
    // start() 成功發起後立即解除 disabled；避免部分瀏覽器 onstart 前狀態卡住。
    micBtn.disabled = false;
  }catch(error){
    if(thisToken === micSessionToken){
      recognition = null;
      resetMicButton();
      setVoiceStatus(micErrorMessage(error), true);
    }
  }
}

window.addEventListener("pagehide", ()=>{
  try{ if(recognition) recognition.abort(); }catch(e){}
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
});

/* ---------- 免費本地即時回答分析：不呼叫 AI、不消耗額度 ---------- */
function escapeAnalysisHtml(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]));
}
function analyzeLocalAnswer(inputId="ansInput", resultId="answerAnalysis"){
  const input = document.getElementById(inputId);
  const panel = document.getElementById(resultId);
  if(!input || !panel) return;
  const answer = input.value.trim();
  if(!answer){
    panel.innerHTML = `<div class="hint-box" style="margin-top:8px">請先輸入英文，或按 🎤 錄音轉成文字，再點「免費分析我的回答」。</div>`;
    return;
  }
  const safeAnswer = escapeAnalysisHtml(answer);
  const normalized = normalizeText(answer);
  const key = (today.dynamic && today.dynamic.correctionKey) || today.correctionKey || "";
  const templates = CORRECTION_TEMPLATE[key] || [];
  const hit = templates.find(t => (t.detect || []).some(d => normalized.includes(normalizeText(d))));
  const tips = [];
  let corrected = answer;
  let score = 75;
  let verdict = "已完成本地文字檢查";
  let detail = "沒有命中目前內建的常見錯誤規則；這不代表每個文法細節都完全正確。";

  if(hit){
    corrected = hit.corrected || hit.natural || answer;
    detail = hit.grammar || "這個句型可以再自然一點。";
    score = 62;
    verdict = "發現一個可改善的常見句型";
    if(hit.natural && hit.natural !== corrected) tips.push(`更自然的說法：${hit.natural}`);
  } else if(/\b(i|you|we|they)\s+no\s+\w+/i.test(answer)){
    corrected = answer.replace(/\b(i|you|we|they)\s+no\s+(\w+)/i, (_,subj,verb)=>`${subj} don't ${verb}`);
    detail = "英文否定句通常需要 don't / doesn't / isn't 等結構，不能直接把 no 放在一般動詞前。";
    score = 58; verdict = "可能有否定句文法問題";
  } else if(/\bwant\s+(?!to\b)([a-z]+)\b/i.test(answer) && !/\bwant\s+(food|water|a|the|some|one|this|that|it)\b/i.test(answer)){
    detail = "如果 want 後面接另一個動作，通常要用 want to + 動詞原形，例如 I want to check in. 若 want 後面接名詞，則不一定需要 to。";
    tips.push("試著確認 want 後面接的是『動作』還是『物品／名詞』。");
    score = 68; verdict = "請檢查 want 的句型";
  }

  let relevant = null;
  if(today.dynamic && typeof isRecognizedForScenario === "function"){
    try{ relevant = isRecognizedForScenario(answer); }catch(e){ relevant = null; }
  }
  if(relevant === true){
    score = Math.min(100, score + 15);
    tips.push("情境判斷：這句話看起來符合目前對話需求。短句只要清楚切題，就可以是好答案。");
  } else if(relevant === false){
    score = Math.max(45, score - 8);
    tips.push("情境判斷：內建規則暫時無法確認這句是否切題，可以加入關鍵資訊，或參考提示句。");
  }
  if(!tips.length && !hit) tips.push("練習建議：確認主詞與動詞搭配，並留意 a/the、複數及 please 等用法；不要為了拿高分刻意把句子拉長。");
  const scoreColor = score >= 80 ? "var(--good)" : score >= 65 ? "var(--accent)" : "var(--bad)";
  panel.innerHTML = `<div class="score-card" style="margin-top:8px;text-align:left">
    <div style="font-weight:700">🧠 免費本地分析（不使用 AI）</div>
    <div class="score-num" style="color:${scoreColor};font-size:26px;margin:5px 0">${score}/100</div>
    <div class="score-fb"><b>你的回答：</b>${safeAnswer}</div>
    <div class="score-fb" style="margin-top:6px"><b>分析結果：</b>${escapeAnalysisHtml(verdict)}</div>
    ${corrected !== answer ? `<div class="score-fb" style="margin-top:6px"><b>建議修正：</b>${escapeAnalysisHtml(corrected)}</div>` : ""}
    <div class="score-fb" style="margin-top:6px"><b>說明：</b>${escapeAnalysisHtml(detail)}</div>
    <ul style="margin:6px 0 0 18px;padding:0">${tips.map(t=>`<li>${escapeAnalysisHtml(t)}</li>`).join("")}</ul>
    <div class="note" style="margin-top:8px">這是依內建規則與情境關鍵字產生的參考分數，不是 AI 語意評分，也不是聲學發音或口音評分。語音辨識若聽錯，分析結果也可能不準。</div>
  </div>`;
}

// 判斷一句話是否「對目前情境而言是合理、切題的回答」——不是用字數判斷，而是看能不能被目前情境的
// 意圖辨識邏輯認出來（例如 "Steak, please." 在餐廳情境能被認出是點主餐，就算合理，不需要長句）
// 判斷這句話是不是「反問對方」而不是真正在回答——避免句子裡剛好出現關鍵字（如 "staying"）
// 就被誤判成有效回答，例如 "Are you staying in...?" 本身是疑問句，不是陳述句
function looksLikeQuestionNotAnswer(sentence){
  const t = normalizeText(sentence);
  return /^(are|is|do|does|can|could|would|will|did|have|has)\s+you\b/.test(t);
}

function isRecognizedForScenario(sentence){
  if(looksLikeQuestionNotAnswer(sentence)) return false;
  if(today.dynamic && today.dynamic.stagedEngine && today.dynamic.identifyIntent){
    return today.dynamic.identifyIntent(sentence).intent !== "UNKNOWN";
  }
  const rules = today.dynamic && today.dynamic.followUpReplies;
  if(rules && !Array.isArray(rules)){
    return !!bestIntentMatch(rules, sentence);
  }
  // 沒有情境專屬規則可用時，退而求其次：至少有兩個字的句子視為合理表達
  return sentence.trim().split(/\s+/).filter(Boolean).length >= 2;
}

// AI 無法使用時的備援：純本地 JavaScript 評估，明確標示「本地基礎評估」，不假裝是真正的 AI 判斷。
// 評分依「是否切題、是否命中已知錯誤模式」決定，不是單純看字數多寡——短句只要切題一樣給高分。
function renderLocalReport(sentences){
  const card = document.getElementById("scoreCard");
  if(!card) return;
  const templates = (today.dynamic.correctionKey && CORRECTION_TEMPLATE[today.dynamic.correctionKey]) || [];

  const analyzed = sentences.map(s => {
    const low = s.toLowerCase();
    const hit = templates.find(t => t.detect.some(d => low.includes(d.toLowerCase())));
    if(hit) return {original:s, corrected:hit.corrected, note:hit.grammar, good:false, matched:true};

    if(looksLikeQuestionNotAnswer(s)){
      return {original:s, corrected:s, note:"這句話像是在反問對方，而不是在回答問題；試著直接陳述你的答案，而不是用疑問句。", good:false, matched:false};
    }
    if(isRecognizedForScenario(s)){
      return {original:s, corrected:s, note:"表達切題又自然，這在真實對話中是完全合理、自然的說法！", good:true, matched:false};
    }
    return {original:s, corrected:s, note:"這句話系統無法確定意圖，可以試著參考下方提示句的說法，或用更明確的字詞表達。", good:false, matched:false};
  });

  // 分數：以「切題比例」為主，命中已知錯誤模式的句子小扣分；不再用句子數量或長度直接加分
  const total = sentences.length || 1;
  const goodCount = analyzed.filter(a => a.good).length;
  const mistakeCount = analyzed.filter(a => a.matched).length;
  const raw = 65 + (goodCount / total) * 32 - mistakeCount * 3;
  const totalScore = Math.max(55, Math.min(98, Math.round(raw)));

  const sentHtml = analyzed.map(it => `
    <div class="hist-item" style="flex-direction:column;align-items:flex-start;gap:4px">
      <div><b>原句：</b>「${it.original}」${it.good ? " ✅" : ""}</div>
      ${it.corrected !== it.original ? `<div><b>建議修正：</b>${it.corrected}</div>` : ""}
      <div style="color:var(--sub)">${it.note}</div>
    </div>`).join("");
  card.innerHTML = `
    <div class="loading" style="margin-bottom:4px">📝 本地基礎評估（非 AI 判斷）</div>
    <div class="score-fb" style="margin-bottom:8px">目前無法連線 AI，以下為根據你這輪對話內容產生的本地初步評估，僅供參考。</div>
    <div class="score-num">${totalScore}/100（粗估）</div>
    <div style="margin-top:10px">${sentHtml}</div>
    <div class="score-fb" style="margin-top:10px"><b>下次練習建議：</b>短句只要切題就是自然的表達，不需要刻意拉長；多留意上面列出的文法重點即可。</div>
    <button class="btn btn-ghost" id="retryAiBtn" style="margin-top:12px;width:100%">🔁 改用 AI 重新評分</button>
    <button class="btn btn-ghost" id="restartBtn2" style="margin-top:8px;width:100%">🔄 再練一輪</button>
  `;
  document.getElementById("restartBtn2").onclick = initDynamic;
  document.getElementById("retryAiBtn").onclick = runScoring;
  recordPracticeOnce(totalScore);
}

async function runScoring(){
  const myToken = sessionToken;
  const card = document.getElementById("scoreCard");
  if(!card) return;
  card.innerHTML = `<div class="loading">AI 正在產生學習報告，請稍候...</div>`;
  const userSentences = log.map(l => l.userAnswer).filter(Boolean);
  if(!aiEnabled){ renderLocalReport(userSentences); return; } // 本地練習模式：不呼叫 AI
  try{
    const sample = await withTimeout(claude.use("sample"), 8000);
    if(myToken !== sessionToken) return; // 評分期間使用者已切換情境／重新開始，放棄這次結果
    if(!sample){ reportAiFailure(); renderLocalReport(userSentences); return; }
    const res = await withTimeout(sample(buildScoringPrompt(userSentences), {modelTier:"quick"}), 20000);
    if(myToken !== sessionToken) return;
    const raw = (res.text || "").trim().replace(/^```json\s*|```$/g, "");
    let parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ parsed = null; }
    if(!parsed || typeof parsed.totalScore === "undefined"){ reportAiFailure(); renderLocalReport(userSentences); return; }
    reportAiSuccess();
    renderAiReport(parsed);
  }catch(err){
    if(myToken !== sessionToken) return;
    reportAiFailure();
    // AI 呼叫失敗：不要卡在「重新評分」的死巷，直接給可用的本地報告，確保一定看得到文法建議
    renderLocalReport(userSentences);
  }
}

async function getAiScore(){
  const card = document.getElementById("scoreCard");
  card.innerHTML = `<div class="loading">AI 評分中...</div>`;

    const transcript = log.map((l,i)=>`情境句 ${i+1}: ${l.npc}\n使用者回答: ${l.userAnswer}`).join("\n\n");
    const prompt = `你是英文口說教練。以下是使用者在「${today.title}」情境中的對話練習紀錄（每題有情境句與使用者的英文回答）：\n\n${transcript}\n\n請用繁體中文評分，格式如下，不要加其他內容：\n分數：X/10\n優點：（一句話）\n可以改進：（一兩個具體建議，例如用字、文法、更道地的說法）`;

// 解析 **粗體(重音)**／word_word(連音底線)／ /(意群換行) 三種標記，轉成可顯示的HTML
function renderMarkedText(str){
  let html = str;
  // 先處理意群換行（這時還是純文字，不會誤判到之後才產生的HTML結尾標籤裡的斜線）
  html = html.replace(/\s*\/\s*/g, '<br>');
  // 連音：允許詞組內含有 ** 粗體標記，整段加底線呈現
  html = html.replace(/((?:\*{0,2}[A-Za-z']+\*{0,2})(?:_(?:\*{0,2}[A-Za-z']+\*{0,2}))+)/g,
    (m) => `<span class="connect">${m.replace(/_/g, ' ')}</span>`);
  // 最後才處理重音粗體
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return html;
}

function wordScore(target, said){
  const norm = s => s.toLowerCase().replace(/[^a-z\s']/g,"").split(/\s+/).filter(Boolean);
  const tw = norm(target), sw = norm(said);
  if(tw.length===0) return 0;
  let hit=0;
  const pool=[...sw];
  tw.forEach(w=>{ const i=pool.indexOf(w); if(i>-1){ hit++; pool.splice(i,1);} });
  return Math.round(100*hit/tw.length);
}

async function toggleShadowRec(targetText, resultElId, btnElId){
  const btn = document.getElementById(btnElId || "shRecBtn");
  const resultEl = document.getElementById(resultElId || "shResult");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(shadowRecognizing){
    if(shadowRecog) shadowRecog.stop();
    if(mediaRecorder && mediaRecorder.state!=="inactive") mediaRecorder.stop();
    return;
  }

  let stream;
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    resultEl.innerHTML = `<div class="transcript">⚠️ ${getMicrophoneHelp({name:"SecurityError"})}</div>`;
    return;
  }
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ resultEl.innerHTML = `<div class="transcript">⚠️ ${getMicrophoneHelp(e)}</div>`; return; }

  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
  mediaRecorder.onstop = ()=>{
    const blob = new Blob(audioChunks, {type:"audio/webm"});
    const url = URL.createObjectURL(blob);
    const audioTag = `<audio controls src="${url}"></audio>`;
    const old = resultEl.innerHTML.replace(/<audio.*?<\/audio>/,"");
    resultEl.innerHTML = old + audioTag;
    stream.getTracks().forEach(tr=>tr.stop());
  };
  mediaRecorder.start();

  if(SR){
    shadowRecog = new SR();
    shadowRecog.lang="en-US"; shadowRecog.interimResults=false;
    shadowRecog.onresult = (e)=>{
      const result = e.results[0][0];
      const said = result.transcript || "";
      const score = wordScore(targetText, said);
      const cls = score>=80?"good":score>=50?"mid":"bad";
      const confidence = Number.isFinite(result.confidence) ? Math.round(result.confidence * 100) : null;
      const clarityText = confidence === null
        ? "此瀏覽器沒有提供辨識信心度。"
        : confidence >= 85 ? "辨識系統很有把握聽懂這段語音；仍不等於口音或發音準確率。"
        : confidence >= 65 ? "辨識系統大致聽懂；可再放慢速度、清楚說出句尾。這不是正式口音評分。"
        : "辨識系統不太確定聽到的內容；請靠近麥克風、降低背景噪音並分段練習。這不是正式口音評分。";
      resultEl.innerHTML = `<div class="match ${cls}">${score}% 句子文字相符度</div>
        ${confidence === null ? "" : `<div class="note" style="margin-top:6px">🎙 語音辨識信心度參考：${confidence}%</div>`}
        <div class="transcript">你說的：「${String(said).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}」</div>
        <div class="note" style="margin-top:4px">${clarityText} 純前端瀏覽器無法可靠評判美式／英式口音或逐音素準確度。</div>`;
    };
    shadowRecog.onend = ()=>{
      shadowRecognizing=false; btn.classList.remove("rec"); btn.textContent="🎙 開始跟讀錄音";
      if(mediaRecorder && mediaRecorder.state!=="inactive") mediaRecorder.stop();
    };
    shadowRecog.start();
  }

  shadowRecognizing=true; btn.classList.add("rec"); btn.textContent="⏹ 停止錄音";
}


function getMicrophoneHelp(error){
  const name = error && error.name ? error.name : "";
  const isSecure = window.isSecureContext;
  const hasApi = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if (!hasApi || !isSecure) {
    return "目前開啟方式不支援麥克風。手機直接開啟下載的 HTML（file://）常會遇到這個限制。請把檔案放到 HTTPS 網站再用 Chrome 開啟；不要只在檔案預覽器中開啟。";
  }
  if (name === "NotAllowedError" || name === "PermissionDeniedError") {
    return "麥克風權限被拒絕。請到手機「設定 → 應用程式 → Chrome → 權限 → 麥克風」允許使用，再到 Chrome 網址列左側的網站設定確認麥克風為允許，重新整理後再試。";
  }
  if (name === "NotFoundError" || name === "DevicesNotFoundError") {
    return "找不到可用的麥克風。請確認手機有可用麥克風，並關閉可能占用麥克風的通話或錄音 App。";
  }
  if (name === "NotReadableError" || name === "TrackStartError") {
    return "麥克風可能正被其他 App 使用，或裝置暫時無法讀取。請關閉通話／錄音 App，重新開啟頁面再試。";
  }
  if (name === "SecurityError") {
    return "瀏覽器因安全限制阻擋麥克風。請使用 HTTPS 網址並以 Chrome 開啟。";
  }
  return "無法啟用麥克風（" + (name || "未知錯誤") + "）。請使用 HTTPS 網址、允許 Chrome 使用麥克風，並關閉其他正在使用麥克風的 App。";
}
