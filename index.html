/* ---------- 第二階段：語音辨識、記憶口說比對、獨立練習紀錄 ----------
   這裡的「相符度」是語音辨識文字跟目標句的字詞比對結果，不是發音準確率——
   辨識本身可能有誤差，畫面上會明確這樣標示，不會假裝是精準的發音評分。
   錄音/辨識狀態與既有的跟讀測驗（toggleShadowRec）完全分開，避免互相污染。 */
let trainMediaRecorder=null, trainAudioChunks=[], trainRecognizing=false, trainRecog=null;

const TRAIN_RECORD_KEY = "travel_train_record_v1";
function loadTrainRecord(){
  try{ const raw = localStorage.getItem(TRAIN_RECORD_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function saveTrainRecord(rec){ try{ localStorage.setItem(TRAIN_RECORD_KEY, JSON.stringify(rec)); }catch(e){} }
function trainRecordKey(themeKey, idx, mode=trainPracticeMode){
  // 保留舊版跟讀紀錄的 key，記憶口說與情境應答各自獨立保存。
  return mode === "shadow" ? themeKey + ":" + idx : mode + ":" + themeKey + ":" + idx;
}
function recordTrainAttempt(themeKey, idx, score, mode=trainPracticeMode){
  const rec = loadTrainRecord();
  const key = trainRecordKey(themeKey, idx, mode);
  rec[key] = {score, attempts: (rec[key] ? rec[key].attempts : 0) + 1, lastAttempt: Date.now()};
  saveTrainRecord(rec);
}
function responseWordScore(target, said){
  // 本地寬鬆關鍵字比對，容許部分常見同義詞；不是語意理解或發音評分。
  const norm = s => s.toLowerCase().replace(/[^a-z\s']/g, " ").split(/\s+/).filter(Boolean);
  const stop = new Set(["a","an","the","is","are","am","do","does","did","we","i","you","our","my","me","us","it","this","that","to","of","for","in","on","at","and","or","could","can","would","please","what","where","how","many","much","there","any","be","have","has","had"]);
  const groups = [
    ["show","provide","give","present"], ["ticket","tickets","admission","pass"],
    ["buy","purchase","get"], ["book","booking","reserve","reservation"],
    ["arrive","reach","get"], ["help","assist"], ["cost","price","charge"],
    ["included","include","cover","covered"], ["cancelled","canceled","cancel"],
    ["change","changed","different","update"], ["tell","let","inform","notify"],
    ["slowly","slower"], ["nearby","close"], ["small","little"]
  ];
  const canonical = w => { for(const g of groups){ if(g.includes(w)) return g[0]; } return w; };
  const tw = [...new Set(norm(target).filter(w=>!stop.has(w)).map(canonical))];
  const sw = new Set(norm(said).filter(w=>!stop.has(w)).map(canonical));
  if(!tw.length) return wordScore(target, said);
  const hit = tw.filter(w=>sw.has(w)).length;
  return Math.round(100*hit/tw.length);
}

async function toggleTrainRec(targetText, themeKey, idx, mode=trainPracticeMode){
  const btn = document.getElementById("trainRecBtn");
  const resultEl = document.getElementById("trainRecResult");
  const startBtnLabel = mode === "shadow" ? "🎙 開始跟讀錄音" : "🎙 開始口說作答";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(trainRecognizing){
    if(trainRecog) trainRecog.stop();
    if(trainMediaRecorder && trainMediaRecorder.state !== "inactive") trainMediaRecorder.stop();
    return;
  }

  if(!SR){
    resultEl.innerHTML = `<div class="transcript">⚠️ 這個瀏覽器不支援語音辨識，請改用「聽＋跟讀」的方式練習，一樣有效。</div>`;
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    resultEl.innerHTML = `<div class="transcript">⚠️ 目前環境無法開啟麥克風。請使用支援麥克風的瀏覽器與安全連線（HTTPS）；仍可使用英文播放和跟讀。</div>`;
    return;
  }
  if(typeof MediaRecorder === "undefined"){
    resultEl.innerHTML = `<div class="transcript">⚠️ 目前瀏覽器不支援錄音回放；若支援語音辨識，仍可進行文字比對。</div>`;
    // 不直接退出：後續語音辨識仍可嘗試使用。
  }

  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ resultEl.innerHTML = `<div class="transcript">⚠️ ${getMicrophoneHelp(e)} 其他練習功能仍可使用。</div>`; return; }

  trainAudioChunks = [];
  if(typeof MediaRecorder !== "undefined"){
    trainMediaRecorder = new MediaRecorder(stream);
    trainMediaRecorder.ondataavailable = e => trainAudioChunks.push(e.data);
    trainMediaRecorder.onstop = ()=>{
      if(trainAudioChunks.length && resultEl.isConnected){
        const blob = new Blob(trainAudioChunks, {type: trainAudioChunks[0]?.type || "audio/webm"});
        const url = URL.createObjectURL(blob);
        const audioTag = `<audio controls src="${url}" style="margin-top:6px"></audio>`;
        const old = resultEl.innerHTML.replace(/<audio.*?<\/audio>/, "");
        resultEl.innerHTML = old + audioTag;
      }
      stream.getTracks().forEach(tr => tr.stop());
    };
    trainMediaRecorder.start();
  }
  trainRecog = new SR();
  trainRecog.lang = "en-US";
  trainRecog.interimResults = false;
  trainRecog.onresult = (e)=>{
    const result = e.results[0][0];
    const said = result.transcript || "";
    const matchScore = mode === "response" ? responseWordScore(targetText, said) : wordScore(targetText, said);
    const confidence = Number.isFinite(result.confidence) ? Math.round(result.confidence * 100) : null;
    // 僅作練習參考：辨識信心度會受麥克風、噪音、口音及瀏覽器影響，不能視為真正的發音／口音分數。
    const practiceScore = confidence === null ? matchScore : Math.round(matchScore * 0.75 + confidence * 0.25);
    const cls = practiceScore >= 80 ? "good" : practiceScore >= 50 ? "mid" : "bad";
    const scoreLabel = mode === "response" ? "關鍵字相符度（本地估算）" : "句子文字相符度";
    const clarityText = confidence === null
      ? "此瀏覽器未提供語音辨識信心度，因此只顯示文字比對結果。"
      : confidence >= 85 ? "辨識系統很有把握聽懂這段語音。可把它當作清晰度線索，但不是口音／發音準確率。"
      : confidence >= 65 ? "辨識系統大致聽懂。試著放慢一點、清楚說出字尾，並減少背景噪音。這不是正式口音評分。"
      : "辨識系統不太確定聽到的內容。請靠近麥克風、降低背景噪音，並把長句分段練習。這不是正式口音評分。";
    resultEl.innerHTML = `
      <div class="match ${cls}">${practiceScore}% 練習參考分（非正式口音評分）</div>
      <div class="note" style="margin-top:5px">${matchScore}% ${scoreLabel}</div>
      ${confidence === null ? "" : `<div class="note" style="margin-top:4px">🎙 語音辨識信心度參考：${confidence}%</div>`}
      <div class="transcript">你說的：「${String(said).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}」</div>
      <div class="note" style="margin-top:4px">${clarityText} 純前端瀏覽器無法可靠判斷美式／英式口音，也無法逐音素評分；正式發音評估需要專用語音評分服務。</div>
      <button class="btn btn-ghost" id="trainRevealAnswerBtn" style="margin-top:8px;width:100%">👁 看參考答案</button>
      <div id="trainAnswerReveal" class="transcript" style="display:none;margin-top:8px"></div>
    `;
    const revealBtn = document.getElementById("trainRevealAnswerBtn");
    if(revealBtn) revealBtn.onclick = ()=>{ const answerEl=document.getElementById("trainAnswerReveal"); if(answerEl){ answerEl.textContent=targetText; answerEl.style.display="block"; revealBtn.textContent="參考答案已顯示"; revealBtn.disabled=true; } };
    recordTrainAttempt(themeKey, idx, matchScore, mode);
    if(mode === "response"){
      const next = document.createElement("div");
      next.className = "note";
      next.style.marginTop = "8px";
      next.textContent = "回答已記錄。你可以先查看參考答案，再按「下一輪對話」繼續。";
      resultEl.appendChild(next);
    }
  };
  trainRecog.onerror = (e)=>{
    if(e.error !== "no-speech" && resultEl.isConnected){
      resultEl.insertAdjacentHTML("beforeend", `<div class="transcript">⚠️ 語音辨識發生問題（${String(e.error || "unknown").replace(/[<>"'&]/g, "")}），請再試一次或改用播放跟讀。</div>`);
    }
  };
  trainRecog.onend = ()=>{
    trainRecognizing = false; btn.classList.remove("rec"); btn.textContent = startBtnLabel;
    if(trainMediaRecorder && trainMediaRecorder.state !== "inactive") trainMediaRecorder.stop();
    else stream.getTracks().forEach(tr => tr.stop());
  };
  try{
    trainRecog.start();
    trainRecognizing = true; btn.classList.add("rec"); btn.textContent = "⏹ 停止錄音";
  }catch(e){
    trainRecognizing = false; btn.classList.remove("rec"); btn.textContent = startBtnLabel;
    if(trainMediaRecorder && trainMediaRecorder.state !== "inactive") trainMediaRecorder.stop();
    else stream.getTracks().forEach(tr => tr.stop());
    resultEl.innerHTML = `<div class="transcript">⚠️ 無法啟動語音辨識，請稍後再試。</div>`;
  }
}

function renderTrain(){
  const theme = SHADOW_TRAINING_THEMES[trainThemeKey];
  if(!theme) { trainThemeKey = Object.keys(SHADOW_TRAINING_THEMES)[0]; return renderTrain(); }
  if(trainIdx >= theme.sentences.length || trainIdx < 0) trainIdx = 0;
  const s = theme.sentences[trainIdx];
  const responseTasks = RESPONSE_DIALOGUES[trainThemeKey] || [];
  if(responseTurnIdx >= responseTasks.length) responseTurnIdx = 0;
  const active = trainPracticeMode === "response" && responseTasks.length ? responseTasks[responseTurnIdx] : s;
  const themeOptions = Object.keys(SHADOW_TRAINING_THEMES).map(k =>
    `<option value="${k}" ${k===trainThemeKey ? "selected" : ""}>${SHADOW_TRAINING_THEMES[k].title}</option>`
  ).join("");
  const modeOptions = [
    {value:"shadow", label:"跟讀訓練：看句子、聽發音"},
    {value:"memory", label:"記憶口說：看中文，不看英文"},
    {value:"response", label:"情境應答：依情境自己回答"}
  ].map(o=>`<option value="${o.value}" ${o.value===trainPracticeMode ? "selected" : ""}>${o.label}</option>`).join("");

  const record = loadTrainRecord();
  const activeIdx = trainPracticeMode === "response" ? responseTurnIdx : trainIdx;
  const recKey = trainRecordKey(trainThemeKey, activeIdx, trainPracticeMode);
  const prevAttempt = record[recKey];
  const activeCount = trainPracticeMode === "response" ? responseTasks.length : theme.sentences.length;
  const themeAttempted = Array.from({length:activeCount}, (_, i) => i).filter(i => record[trainRecordKey(trainThemeKey, i, trainPracticeMode)]).length;
  const reviewItems = [];
  if(trainPracticeMode !== "response") Object.keys(SHADOW_TRAINING_THEMES).forEach(tk=>{
    SHADOW_TRAINING_THEMES[tk].sentences.forEach((sent, i)=>{
      const r = record[trainRecordKey(tk, i, trainPracticeMode)];
      if(r && r.score < 70) reviewItems.push({tk, i, en: sent.en, score: r.score});
    });
  });

  const promptTitle = trainPracticeMode === "memory" ? "記憶口說任務" : trainPracticeMode === "response" ? "情境應答任務" : "跟讀句子";
  const promptText = trainPracticeMode === "shadow" ? (trainShowEnglish ? s.en : "●●●●●●●●●●") : active.zh;
  const promptHint = trainPracticeMode === "shadow"
    ? (trainShowEnglish ? "先聽原句，再跟著說；也可以隱藏英文練習。" : "英文已隱藏，試著回想整句，再錄音比對。")
    : trainPracticeMode === "memory"
      ? "只看中文提示，先自己用英文說出整句；錄音前不會顯示英文答案。"
      : "想像你正身處這個場景，直接用英文完成任務；可用不同說法，系統以關鍵字作寬鬆估算。";

  document.getElementById("trainPane").innerHTML = `
    <div class="banner" style="margin-bottom:12px">
      <div class="tag">獨立練習｜不影響每日對話與跟讀測驗</div>
      <label for="trainModeSelect" class="note" style="display:block;text-align:left;margin:8px 0 4px">練習方式</label>
      <select id="trainModeSelect" class="train-select">${modeOptions}</select>
      <label for="trainThemeSelect" class="note" style="display:block;text-align:left;margin:10px 0 4px">旅遊情境（下拉選單）</label>
      <select id="trainThemeSelect" class="train-select">${themeOptions}</select>
      <div class="t" style="font-size:15px;margin-top:10px">${theme.title}</div>
    </div>
    <div class="step-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--accent);font-weight:700">${promptTitle}｜${active.difficulty || s.difficulty}</span>
        <span class="note" style="margin:0;white-space:nowrap">${trainIdx+1}/${theme.sentences.length}</span>
      </div>
      ${trainPracticeMode === "response" ? `<div class="step-title" style="margin-top:12px">情境 ${responseTurnIdx+1}/${responseTasks.length || 3}：${active.scenario}</div>` : `<div class="step-title" style="margin-top:12px">${s.scenario}</div>`}
      <div style="margin-top:8px;font-size:${trainPracticeMode === "shadow" ? "18px" : "17px"};font-weight:700;line-height:1.5">${promptText}</div>
      ${trainPracticeMode === "shadow" && trainShowEnglish ? `<div class="zh" style="margin-top:5px">${s.zh}</div>` : ""}
      <div class="note" style="margin-top:8px">${promptHint}</div>
      ${trainPracticeMode === "shadow" ? `<div class="note">關鍵片語：${s.keyPhrase}</div><div class="note">發音提醒：${s.tip}</div>` : ""}
      ${prevAttempt ? `<div class="note" style="margin-top:8px">✅ 此模式已練習 ${prevAttempt.attempts} 次，最近一次相符度 ${prevAttempt.score}%</div>` : ""}
    </div>
    ${trainPracticeMode === "shadow" ? `
      <div class="toolrow">
        <button class="btn btn-ghost" id="trainPlayBtn">🔊 正常速度</button>
        <button class="btn btn-ghost" id="trainSlowBtn">🐢 慢速播放</button>
        <button class="btn btn-ghost" id="trainRepeatBtn">🔁 連播 3 次</button>
      </div>
      <div class="toolrow"><button class="btn btn-ghost" id="trainToggleBtn" style="width:100%">${trainShowEnglish ? "🙈 隱藏英文（自己試著說說看）" : "👁 顯示英文"}</button></div>
    ` : `
      <div class="toolrow"><button class="btn btn-ghost" id="trainPlayPromptBtn" style="width:100%">🔊 播放中文任務（不播放英文答案）</button></div>
      <div class="toolrow"><button class="btn btn-ghost" id="trainRevealBtn" style="width:100%">👁 看參考答案（先回答再看）</button></div>
      <div id="trainStaticAnswer" class="step-card" style="display:none;margin-top:8px"><div class="step-title">參考答案</div><div style="font-weight:700;line-height:1.5">${active.en}</div><div class="zh">${active.zh}</div></div>
    `}
    <div class="shadow-card" style="margin-top:10px">
      <button class="btn btn-mic" id="trainRecBtn" style="width:100%">🎙 ${trainPracticeMode === "shadow" ? "開始跟讀錄音" : "開始口說作答"}</button>
      <div class="note" style="margin-top:6px">評分說明：會顯示句子相符度與瀏覽器提供的語音辨識信心度，合成練習參考分。這不是專業口音評分，也不會判斷你像不像美式或英式口音。</div>
      <div id="trainRecResult"></div>
    </div>
    <div class="toolrow">
      <button class="btn btn-ghost" id="trainPrevBtn">← ${trainPracticeMode === "response" ? "上一輪" : "上一句"}</button>
      <button class="btn btn-ghost" id="trainNextBtn">${trainPracticeMode === "response" ? "下一輪對話 →" : "下一句 →"}</button>
    </div>
    <div class="note" style="text-align:center;margin-top:4px">本情境共 ${activeCount} ${trainPracticeMode === "response" ? "輪" : "句"}，這個模式已練習 ${themeAttempted} ${trainPracticeMode === "response" ? "輪" : "句"}</div>
    ${reviewItems.length ? `
    <div class="step-card" style="margin-top:12px">
      <div class="step-title">📌 建議複習（最近一次相符度低於70%）</div>
      ${reviewItems.slice(0,8).map(r=>`<div style="margin-top:6px;cursor:pointer" data-review-tk="${r.tk}" data-review-i="${r.i}">• ${r.en}　<span style="color:var(--bad)">(${r.score}%)</span></div>`).join("")}
    </div>` : ""}
    ${trainPracticeMode === "response" ? `<div class="note">離線引導式角色扮演：每個旅遊情境有 3 輪連續任務。使用本地關鍵字與常見同義詞估算，不會呼叫 AI；這不是完整語意理解。參考答案只有你按下按鈕後才會顯示。</div>` : ""}
  `;

  document.getElementById("trainModeSelect").onchange = e=>{ trainPracticeMode=e.target.value; trainIdx=0; responseTurnIdx=0; trainShowEnglish=trainPracticeMode==="shadow"; renderTrain(); };
  document.getElementById("trainThemeSelect").onchange = e=>{ trainThemeKey=e.target.value; trainIdx=0; responseTurnIdx=0; trainShowEnglish=trainPracticeMode==="shadow"; renderTrain(); };
  document.querySelectorAll("[data-review-tk]").forEach(el=>{
    el.onclick = ()=>{ trainThemeKey=el.dataset.reviewTk; trainIdx=parseInt(el.dataset.reviewI,10); trainShowEnglish=trainPracticeMode==="shadow"; renderTrain(); };
  });
  const playPromptBtn=document.getElementById("trainPlayPromptBtn");
  if(playPromptBtn) playPromptBtn.onclick=()=>speak(s.zh, 0.9, "zh-TW");
  const revealBtn=document.getElementById("trainRevealBtn");
  if(revealBtn) revealBtn.onclick=()=>{ const answer=document.getElementById("trainStaticAnswer"); if(answer) answer.style.display=answer.style.display==="none"?"block":"none"; };
  const playBtn=document.getElementById("trainPlayBtn"); if(playBtn) playBtn.onclick=()=>speak(s.en, 1);
  const slowBtn=document.getElementById("trainSlowBtn"); if(slowBtn) slowBtn.onclick=()=>speak(s.en, 0.7);
  const repeatBtn=document.getElementById("trainRepeatBtn"); if(repeatBtn) repeatBtn.onclick=()=>speakRepeated(s.en, 0.85, 3);
  const toggleBtn=document.getElementById("trainToggleBtn"); if(toggleBtn) toggleBtn.onclick=()=>{ trainShowEnglish=!trainShowEnglish; renderTrain(); };
  document.getElementById("trainRecBtn").onclick = ()=> toggleTrainRec(trainPracticeMode === "response" ? active.en : s.en, trainThemeKey, trainPracticeMode === "response" ? responseTurnIdx : trainIdx, trainPracticeMode);
  document.getElementById("trainPrevBtn").onclick = ()=>{
    if(trainPracticeMode === "response" && responseTasks.length){ responseTurnIdx=(responseTurnIdx-1+responseTasks.length)%responseTasks.length; }
    else { trainIdx=(trainIdx-1+theme.sentences.length)%theme.sentences.length; }
    renderTrain();
  };
  document.getElementById("trainNextBtn").onclick = ()=>{
    if(trainPracticeMode === "response" && responseTasks.length){ responseTurnIdx=(responseTurnIdx+1)%responseTasks.length; }
    else { trainIdx=(trainIdx+1)%theme.sentences.length; }
    renderTrain();
  };
}

/* ---------- Tabs ---------- */
document.querySelectorAll(".tab").forEach(tb=>{
  tb.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    tb.classList.add("active");
    const m = tb.dataset.mode;
    document.getElementById("chatPane").style.display = m==="chat" ? "block":"none";
    document.getElementById("shadowPane").style.display = m==="shadow" ? "block":"none";
    document.getElementById("trainPane").style.display = m==="train" ? "block":"none";
    document.getElementById("statsPane").style.display = m==="stats" ? "block":"none";
    if(m==="shadow") renderShadow();
    if(m==="train") renderTrain();
    if(m==="stats") renderStats();
  });
});

renderPicker();
showStartGate();
</script>
</body>
</html>
